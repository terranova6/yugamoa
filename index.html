<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>육아모아</title>
<meta name="description" content="수유·기저귀·수면·체온·성장·접종 기록을 한 곳에 모은 육아 기록 앱">
<meta name="theme-color" content="#0e7c6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="육아모아">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>/* 육아모아 — 한 손으로, 새벽에도 읽히는 기록장.
   레이아웃: 560px 단일 컬럼 + 하단 탭. 기록 종류마다 고유 색(--c-*)을 쓰고 나머지는 차분한 청회색 계열. */
:root {
  --bg: #f2f4f7;
  --surface: #ffffff;
  --surface-2: #e9edf2;
  --ink: #1b2130;
  --muted: #5f6a80;
  --line: #d9dfe8;
  --accent: #0e7c6b;
  --accent-ink: #ffffff;
  --accent-soft: #d8efe9;
  --ok: #24864f;
  --warn: #b77900;
  --danger: #cf3f25;
  --danger-soft: #fbe3dd;
  --warn-soft: #fbefd2;
  --ok-soft: #dcf1e3;
  --shadow: 0 1px 2px rgba(27, 33, 48, .06), 0 4px 16px rgba(27, 33, 48, .06);

  --c-feed: #e6a23c; --c-breast: #e0607a; --c-formula: #e39a2b; --c-pumped: #84a832; --c-pump: #a978d4;
  --c-solid: #1fa898; --c-snack: #d06f8a; --c-milk: #b8955a; --c-water: #3d97c9;
  --c-diaper: #9a7350; --c-sleep: #6266cc; --c-bath: #2f90cc; --c-play: #4a76db; --c-tummy: #5a8de0;
  --c-temp: #e2502a; --c-med: #2a9a57; --c-symptom: #c79400; --c-hospital: #16958a; --c-vaccine: #7a58c2;
  --c-growth: #d9658e; --c-diary: #8a6bb6; --c-etc: #7d8396; --c-photo: #e0457b;

  --f-display: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --r: 14px;
  --nav-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1217; --surface: #171d25; --surface-2: #212934; --ink: #e6ebf2; --muted: #93a0b4; --line: #2a3340;
    --accent: #38bfa6; --accent-ink: #062520; --accent-soft: #143a34; --ok: #4cc77f; --warn: #e5b23c; --danger: #ff6d50;
    --danger-soft: #3d1f19; --warn-soft: #3a2f14; --ok-soft: #173325;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1217; --surface: #171d25; --surface-2: #212934; --ink: #e6ebf2; --muted: #93a0b4; --line: #2a3340;
  --accent: #38bfa6; --accent-ink: #062520; --accent-soft: #143a34; --ok: #4cc77f; --warn: #e5b23c; --danger: #ff6d50;
  --danger-soft: #3d1f19; --warn-soft: #3a2f14; --ok-soft: #173325;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; text-wrap: balance; margin: 0; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.tiny { font-size: .74rem; }
.label { font-size: .74rem; letter-spacing: .04em; color: var(--muted); }

#app { max-width: 560px; margin: 0 auto; min-height: 100vh; padding: 0 16px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px)); }

/* 상단 */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bg); margin: 0 -16px; padding: 10px 16px 8px;
  display: flex; align-items: center; gap: 10px;
}
.kid-switch { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; text-align: left; min-width: 0; flex: 1; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-family: var(--f-display); font-size: 1.1rem; flex: none; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.kid-name { font-family: var(--f-display); font-size: 1.15rem; line-height: 1.2; }
.kid-age { font-size: .8rem; color: var(--muted); }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--surface); display: grid; place-items: center; box-shadow: var(--shadow); flex: none; }
.icon-btn svg { width: 20px; height: 20px; }

/* 하단 탭 */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.nav-inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); }
.nav button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-size: .72rem; }
.nav button svg { width: 22px; height: 22px; }
.nav button[aria-current="page"] { color: var(--accent); font-weight: 600; }

/* 공통 블록 */
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.card { background: var(--surface); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow); }
.card.flat { box-shadow: none; border: 1px solid var(--line); }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 18px 2px 8px; }
.section-title h2 { font-size: 1.05rem; }
.link-btn { background: none; border: 0; color: var(--accent); font-size: .85rem; padding: 4px 2px; }
.btn { border: 0; border-radius: 12px; padding: 12px 16px; background: var(--surface-2); font-weight: 600; min-height: 46px; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex: none; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.block { display: flex; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.danger { background: var(--danger-soft); color: var(--danger); }
.btn.block { width: 100%; }
.btn.sm { min-height: 34px; padding: 6px 12px; font-size: .85rem; border-radius: 10px; }
.btn:disabled { opacity: .45; }
.seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: none; border-radius: 9px; padding: 8px 4px; font-size: .86rem; color: var(--muted); min-height: 36px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: var(--shadow); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: .86rem; min-height: 34px; }
.chip[aria-pressed="true"] { background: var(--tone, var(--accent)); border-color: var(--tone, var(--accent)); color: #fff; font-weight: 600; }
.chip.add { color: var(--muted); border-style: dashed; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: .75rem; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.danger { background: var(--danger-soft); color: var(--danger); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; font-size: .9rem; }
.notice { border-radius: 12px; padding: 10px 12px; font-size: .85rem; background: var(--surface-2); }
.notice.warn { background: var(--warn-soft); color: var(--ink); }
.notice.danger { background: var(--danger-soft); color: var(--ink); }
.notice.ok { background: var(--ok-soft); }
.notice.accent { background: var(--accent-soft); }
.notice b { font-weight: 700; }
.divider { height: 1px; background: var(--line); margin: 4px 0; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--tone, var(--muted)); flex: none; }
a { color: var(--accent); }

/* 홈 */
.status-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.status { background: var(--surface); border-radius: 12px; padding: 10px 12px; box-shadow: var(--shadow); border: 0; text-align: left; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.status .label { display: flex; align-items: center; gap: 6px; }
.status .val { font-size: 1.12rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.status .sub { font-size: .78rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 6px; }
.quick button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: .8rem; padding: 4px 0; color: var(--ink); }
.qicon { width: 52px; height: 52px; border-radius: 18px; background: var(--tone); color: #fff; display: grid; place-items: center; }
.qicon svg { width: 26px; height: 26px; }
.timer-card { border-left: 0; display: flex; flex-direction: column; gap: 10px; background: var(--surface); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.timer-card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--tone); }
.timer-val { font-size: 2rem; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.demo-bar { display: flex; align-items: center; gap: 8px; justify-content: space-between; background: var(--warn-soft); border-radius: 12px; padding: 8px 12px; font-size: .84rem; }

/* 기록 목록 */
.rec-list { display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.rec { display: grid; grid-template-columns: 64px 14px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 11px 12px; border: 0; background: none; text-align: left; border-bottom: 1px solid var(--line); width: 100%; }
.rec:last-child { border-bottom: 0; }
.rec .t { font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.25; }
.rec .title { font-weight: 600; color: var(--tone); }
.rec .detail { font-size: .82rem; color: var(--muted); overflow-wrap: anywhere; }
.rec .thumb { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
.day-head { display: flex; justify-content: space-between; align-items: baseline; margin: 16px 2px 6px; font-weight: 600; }
.day-head .muted { font-weight: 400; font-size: .82rem; }
.gap-pill { align-self: flex-start; margin: 2px 0 2px 70px; }

/* 시트(편집기)와 페이지 */
.scrim { position: fixed; inset: 0; background: rgba(10, 14, 20, .45); z-index: 50; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; max-width: 560px; margin: 0 auto;
  background: var(--bg); border-radius: 20px 20px 0 0; max-height: 94vh; display: flex; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-radius: 20px 20px 0 0; background: var(--tone, var(--accent)); color: #fff; }
.sheet-head h2 { flex: 1; text-align: center; font-size: 1.1rem; }
.sheet-head button { background: rgba(255, 255, 255, .18); color: #fff; border: 0; border-radius: 10px; min-width: 40px; height: 36px; padding: 0 10px; font-weight: 600; }
.sheet-body { overflow-y: auto; padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; }
.page { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; }
.page-inner { max-width: 560px; margin: 0 auto; padding: 0 16px 40px; }
.page-head { position: sticky; top: 0; z-index: 2; background: var(--bg); display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top, 0px)) 0 10px; }
.page-head h1 { font-size: 1.2rem; flex: 1; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field > .label { font-size: .8rem; }
.input, select.input, textarea.input {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 12px; min-height: 46px;
}
textarea.input { min-height: 84px; resize: vertical; }
.input:focus { border-color: var(--accent); outline: none; }
.stepper { display: grid; grid-template-columns: 52px minmax(0, 1fr) 52px; gap: 8px; align-items: center; }
.stepper button { height: 52px; border-radius: 14px; border: 0; background: var(--surface); box-shadow: var(--shadow); font-size: 1.3rem; }
.stepper input { text-align: center; font-size: 1.6rem; font-weight: 600; font-variant-numeric: tabular-nums; height: 52px; }
.unit-row { display: flex; align-items: center; gap: 8px; }
.unit-row .input { flex: 1; min-width: 0; }
.quick-times { display: flex; flex-wrap: wrap; gap: 6px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.side-box { background: var(--surface); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 6px; align-items: center; box-shadow: var(--shadow); }
.side-box .big { font-size: 1.4rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.photos { display: flex; gap: 8px; flex-wrap: wrap; }
.photo-tile { width: 76px; height: 76px; border-radius: 12px; overflow: hidden; position: relative; background: var(--surface-2); border: 0; padding: 0; }
.photo-tile img { width: 100%; height: 100%; object-fit: cover; }
.photo-tile .x { position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0, 0, 0, .6); color: #fff; font-size: 13px; line-height: 22px; text-align: center; }
.photo-add { display: grid; place-items: center; color: var(--muted); border: 1px dashed var(--line); background: var(--surface); }
.big-temp { font-size: 2.6rem; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; line-height: 1.1; }

/* 차트 */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--f-body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart-wrap { overflow-x: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: .78rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }

/* 목록형 설정 */
.menu { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.menu > button, .menu > a, .menu > .item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px; border: 0; background: none; text-align: left; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none; }
.menu > :last-child { border-bottom: 0; }
.menu > .item { padding: 10px 14px; gap: 8px; }
.menu .mi { width: 34px; height: 34px; border-radius: 10px; background: var(--tone, var(--accent)); color: #fff; display: grid; place-items: center; flex: none; }
.menu .mi svg { width: 19px; height: 19px; }
.menu .chev { margin-left: auto; color: var(--muted); }
.phase { font-size: .68rem; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 5px; margin-left: auto; }

/* 접종·검진 */
.sched { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; }
.sched:last-child { border-bottom: 0; }
.menu > .sched { display: grid; }
.sched .nm { font-weight: 600; }
.sched .when { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 12px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; z-index: 90; font-size: .9rem; max-width: calc(100% - 32px); }
.lock { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; }
.pin-dots { display: flex; gap: 14px; }
.pin-dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--muted); }
.pin-dots i.on { background: var(--accent); border-color: var(--accent); }
.keypad { display: grid; grid-template-columns: repeat(3, 72px); gap: 12px; }
.keypad button { height: 64px; border-radius: 18px; border: 0; background: var(--surface); font-size: 1.4rem; box-shadow: var(--shadow); }

.onboard { padding-block: 14vh 24px; display: flex; flex-direction: column; gap: 18px; min-height: calc(100dvh - 24px); }
.onboard-actions { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.onboard-actions p { margin: 4px 0 0; text-align: center; }
.brand { font-family: var(--f-display); font-size: 2.2rem; line-height: 1.1; }
.brand small { display: block; font-family: var(--f-body); font-size: .95rem; color: var(--muted); margin-top: 8px; }

.album { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
.album button { aspect-ratio: 1; border: 0; padding: 0; background: var(--surface-2); overflow: hidden; border-radius: 6px; max-width: 100%; }
.album img { width: 100%; height: 100%; object-fit: cover; }
.viewer { position: fixed; inset: 0; z-index: 95; background: rgba(0, 0, 0, .92); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; gap: 10px; color: #fff; }
.viewer img { max-height: 80vh; border-radius: 8px; }

.bar-track { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--tone, var(--accent)); border-radius: 99px; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; }
.check:last-child { border-bottom: 0; }
.check .box { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line); flex: none; display: grid; place-items: center; margin-top: 1px; }
.check[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.check .box svg { width: 14px; height: 14px; }
ul.plain { margin: 0; padding-left: 18px; }
ul.plain li { margin: 3px 0; }

.report { background: var(--surface); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); }
.report table { width: 100%; border-collapse: collapse; font-size: .84rem; font-variant-numeric: tabular-nums; }
.report table:has(th:nth-child(5)) { min-width: 440px; }
.report td:first-child { white-space: nowrap; }
.report th, .report td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.report th { color: var(--muted); font-weight: 600; font-size: .76rem; }
.report h3 { margin: 16px 0 6px; font-family: var(--f-body); font-weight: 700; font-size: .95rem; }
.report .rh { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
.table-wrap { overflow-x: auto; }

@media print {
  body { background: #fff; color: #000; }
  .nav, .page-head, .no-print, .topbar { display: none !important; }
  .page { position: static; overflow: visible; }
  .report { box-shadow: none; padding: 0; }
  #app > :not(.page) { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
}
@media (max-width: 360px) {
  .quick { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

/* 드르륵 눈금자 */
.ruler { display: flex; flex-direction: column; gap: 4px; outline: none; }
.ruler:focus-visible .ruler-track { outline: 2px solid var(--accent); outline-offset: 2px; }
.ruler-val { display: flex; align-items: baseline; justify-content: center; gap: 8px; min-height: 2.2rem; }
.ruler-val b { font-size: 1.75rem; font-weight: 600; color: var(--tone, var(--ink)); }
.ruler-sub { font-size: .8rem; color: var(--muted); }
.ruler-track { position: relative; height: 54px; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); touch-action: pan-y; cursor: grab; overflow: hidden; user-select: none; -webkit-user-select: none; }
.ruler-track:active { cursor: grabbing; }
.ruler-track canvas { width: 100%; height: 100%; display: block; }
.ruler-needle { position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; background: var(--tone, var(--accent)); border-radius: 2px; pointer-events: none; }
.ruler-needle::before { content: ""; position: absolute; top: -1px; left: -5px; border: 6.5px solid transparent; border-top-color: var(--tone, var(--accent)); }
.ruler-edge { position: absolute; top: 50%; transform: translateY(-50%); font-size: 1.3rem; color: var(--muted); opacity: .45; pointer-events: none; }
.ruler-edge.l { left: 8px; } .ruler-edge.r { right: 8px; }
.ruler-track::before, .ruler-track::after { content: ""; position: absolute; top: 0; bottom: 0; width: 34px; z-index: 1; pointer-events: none; }
.ruler-track::before { left: 0; background: linear-gradient(90deg, var(--surface), transparent); }
.ruler-track::after { right: 0; background: linear-gradient(-90deg, var(--surface), transparent); }
details.manual summary { font-size: .8rem; color: var(--muted); cursor: pointer; padding: 2px 0; }
details.manual[open] summary { margin-bottom: 6px; }
.sheet-foot { padding: 10px 16px 12px; border-top: 1px solid var(--line); background: var(--bg); }
.sheet-foot .btn { min-height: 52px; font-size: 1.02rem; }

/* 한 손 타이머 */
.btn.big { min-height: 58px; font-size: 1.08rem; border-radius: 16px; }
.side-btn { border: 2px solid var(--line); background: var(--surface); border-radius: 16px; padding: 12px 8px; min-height: 92px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--ink); }
.side-btn b { font-size: 1.45rem; }
.side-btn[aria-pressed="true"] { border-color: var(--tone); background: color-mix(in srgb, var(--tone) 14%, var(--surface)); }
.side-btn[aria-pressed="true"] .tiny { color: var(--tone); font-weight: 600; }
.quick button { -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.qicon { position: relative; transition: transform .15s; }
.hold-dot { position: absolute; top: 4px; right: 4px; width: 7px; height: 7px; border-radius: 50%; background: #fff; opacity: .9; }
.holding .qicon { transform: scale(.9); box-shadow: 0 0 0 4px color-mix(in srgb, var(--tone) 35%, transparent); transition: transform .45s, box-shadow .45s; }
.timer-bar { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); z-index: 29; padding: 6px 12px; display: flex; flex-direction: column; gap: 6px; max-width: 560px; margin: 0 auto; }
.tb-item { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 14px; padding: 8px 8px 8px 14px; box-shadow: 0 4px 18px rgba(0, 0, 0, .14); border: 1px solid var(--line); }
.tb-item .dot { background: var(--tone); }
/* 다음 예상 */
.pred-card { display: flex; flex-direction: column; gap: 2px; }
.pred-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; padding: 10px 0; border-top: 1px solid var(--line); color: inherit; font: inherit; min-height: 56px; }
.pred-row:first-of-type { border-top: 0; }
.pred-row .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--tone); flex: none; }
.pred-row .num { font-weight: 700; font-size: 1.05rem; }
.report tr.on td { background: var(--accent-soft, rgba(0,128,96,.1)); font-weight: 600; }
/* 사진 보기 · 하트 · 댓글 */
.viewer { justify-content: flex-start; overflow-y: auto; background: #111; padding-top: max(12px, env(safe-area-inset-top)); }
.viewer-top { width: 100%; max-width: 640px; color: #fff; }
.viewer-top .btn { background: rgba(255,255,255,.14); color: #fff; }
.viewer-img { position: relative; width: 100%; max-width: 640px; display: flex; justify-content: center; }
.viewer-img img { max-width: 100%; max-height: 62vh; border-radius: 8px; }
.vnav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(0,0,0,.45); color: #fff; display: grid; place-items: center; }
.vnav.prev { left: 4px; } .vnav.next { right: 4px; }
.vnav svg { width: 22px; height: 22px; }
.viewer-panel { width: 100%; max-width: 640px; background: var(--surface); color: var(--ink); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.react-bar { display: flex; align-items: center; gap: 8px; }
.heart-btn { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 6px 12px; min-height: 40px; font-weight: 700; }
.heart-btn svg { width: 20px; height: 20px; }
.heart-btn[aria-pressed="true"] { color: #e0457b; border-color: #e0457b55; background: #e0457b14; }
.cm-list { display: flex; flex-direction: column; gap: 6px; }
.cm { font-size: .88rem; line-height: 1.45; }
.rx { font-size: .72rem; color: var(--muted); margin-left: 4px; white-space: nowrap; }
.icon-only svg { width: 18px; height: 18px; }
/* 달력 */
.cal-nav { margin: 4px 0 8px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.cal-wd { text-align: center; font-size: .72rem; color: var(--muted); padding: 2px 0; }
.cal-day { position: relative; aspect-ratio: 1; border: 0; border-radius: 8px; background: var(--surface); overflow: hidden; padding: 0; color: var(--ink); font: inherit; }
.cal-day:disabled { opacity: .35; }
.cal-day img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cal-day img + .cal-n { color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.7); }
.cal-n { position: absolute; top: 3px; left: 5px; font-size: .74rem; font-weight: 600; }
.cal-ms { position: absolute; left: 2px; right: 2px; bottom: 2px; font-size: .58rem; font-weight: 700; background: var(--accent); color: #fff; border-radius: 4px; text-align: center; white-space: nowrap; overflow: hidden; }
.cal-dot { position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--c-diary); box-shadow: 0 0 0 1.5px #fff; }
.cal-day.today { box-shadow: inset 0 0 0 2px var(--accent); }
.cal-day.sel { box-shadow: inset 0 0 0 3px var(--c-diary); }
/* 성장 스티커 */
.stk-cv { width: 100%; height: auto; border-radius: 12px; background: var(--surface-2); }
/* 음성 메모 */
.voice { display: flex; align-items: center; gap: 8px; }
.voice audio { flex: 1; min-width: 0; height: 40px; }
.rec-on { background: #e0457b; color: #fff; }
/* 앨범책 */
.book { display: flex; flex-direction: column; gap: 14px; margin-top: 14px; }
.book-page { background: #fff; color: #222; border-radius: 12px; padding: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.book-page header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid #0e7c6b; padding-bottom: 6px; margin-bottom: 10px; }
.book-page h3 { margin: 0; font-size: 1.3rem; color: #0e7c6b; }
.book-page header span { font-size: .8rem; color: #666; }
.book-cover { text-align: center; }
.book-cover img { width: 100%; max-height: 420px; object-fit: cover; border-radius: 10px; }
.book-cover h2 { margin: 14px 0 4px; }
.book-growth { font-size: .85rem; color: #555; margin: 0 0 8px; }
.book-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.book-grid.n1 { grid-template-columns: 1fr; } .book-grid.n2 { grid-template-columns: 1fr 1fr; } .book-grid.n4 { grid-template-columns: repeat(3, 1fr); }
.book-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; }
.book-grid.n1 img { aspect-ratio: 4 / 3; }
.book-diary { margin-top: 10px; font-size: .88rem; }
.book-diary p { margin: 2px 0 0; white-space: pre-wrap; }
.book-cm { color: #666; font-size: .8rem; }
@media print {
  .book { gap: 0; margin: 0; }
  .book-page { box-shadow: none; border-radius: 0; break-after: page; page-break-after: always; padding: 0; }
  .book-page:last-child { break-after: auto; page-break-after: auto; }
  .viewer, .sheet, .scrim { display: none !important; }
}
/* 앨범 탭 · 피드 */
.nav button { position: relative; }
.nav-badge { position: absolute; top: 6px; left: calc(50% + 6px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--c-photo); color: #fff; font-size: .62rem; font-style: normal; font-weight: 700; display: grid; place-items: center; }
.album-head { display: flex; justify-content: space-between; align-items: center; margin: 4px 2px 10px; }
.album-title { margin: 0; font-size: 1.25rem; }
.album-upload { margin-bottom: 12px; }
.upload-btn { display: flex; width: 100%; min-height: 54px; font-size: 1rem; gap: 8px; cursor: pointer; }
.upload-btn svg { width: 22px; height: 22px; }
.upload-btn.sm { width: auto; min-height: 40px; font-size: .85rem; }
.album-upload .tiny { margin: 6px 2px 0; text-align: center; }
.album-empty { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--muted); padding: 36px 18px; }
.album-empty b { color: var(--ink); }
.feed { display: flex; flex-direction: column; gap: 14px; margin-top: 12px; }
.post { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.post.is-new { box-shadow: 0 0 0 2px var(--c-photo); }
.post-head { display: flex; align-items: center; gap: 10px; padding: 12px 12px 8px; }
.post-av { width: 36px; height: 36px; border-radius: 50%; background: var(--c-photo); color: #fff; display: grid; place-items: center; font-weight: 700; flex: none; }
.post-cap { margin: 0 14px 8px; font-size: .92rem; white-space: pre-wrap; }
.post-grid { display: grid; gap: 2px; }
.post-grid.n2, .post-grid.n4 { grid-template-columns: 1fr 1fr; }
.post-grid.n3 { grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; }
.post-grid.n3 button:first-child { grid-row: span 2; }
.post-grid button { position: relative; border: 0; padding: 0; background: var(--surface-2); aspect-ratio: 1; overflow: hidden; }
.post-grid.n1 button { aspect-ratio: 4 / 3; }
.post-grid.n3 button:first-child { aspect-ratio: auto; }
.post-grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
.post-more { position: absolute; inset: 0; background: rgba(0,0,0,.45); color: #fff; font-size: 1.4rem; font-weight: 700; display: grid; place-items: center; }
.post-foot { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
.cm-btn { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 6px 12px; min-height: 40px; font-weight: 600; font-size: .85rem; }
.cm-btn svg { width: 18px; height: 18px; }
.post-cms { padding: 0 14px 12px; font-size: .86rem; }
.post-cms p { margin: 2px 0; }
/* 홈 최근 사진 */
.photo-strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.photo-strip button, .strip-add { flex: none; width: 76px; height: 76px; border-radius: 12px; overflow: hidden; border: 0; padding: 0; background: var(--surface-2); }
.photo-strip img { width: 100%; height: 100%; object-fit: cover; }
.strip-add { display: grid; place-items: center; color: var(--c-photo); border: 2px dashed var(--c-photo); background: var(--surface); cursor: pointer; }
.strip-add svg { width: 26px; height: 26px; }
.photo-cta { display: flex; align-items: center; gap: 10px; margin-top: 12px; border-left: 4px solid var(--c-photo); }

/* 홈 위 카드 바꾸기 */
.status-cell { position: relative; display: flex; min-width: 0; }
.status-cell > .status { flex: 1; width: 100%; }
.status-cell > .status .label { padding-right: 30px; }
.status-pen { position: absolute; top: 4px; right: 4px; width: 36px; height: 36px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); display: grid; place-items: center; opacity: .75; }
.status-pen svg { width: 17px; height: 17px; }
.status-pen:active { background: var(--line); opacity: 1; }
.status-empty { align-items: center; justify-content: center; gap: 4px; min-height: 92px; color: var(--muted); border: 2px dashed var(--line) !important; background: transparent !important; box-shadow: none !important; font-size: .9rem; }
.status-empty svg { width: 22px; height: 22px; }
.slot-sheet { --tone: var(--accent); }
.slot-list { display: flex; flex-direction: column; gap: 6px; }
.slot-opt { display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: inherit; min-height: 56px; }
.slot-opt.on { border: 2px solid var(--accent); }
.slot-opt .pill { font-size: .72rem; vertical-align: 1px; }
.slot-val { flex: none; max-width: 38%; font-size: .85rem; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.status-preview { pointer-events: none; }
.status-preview .status-grid { margin-top: 0 !important; }
.slot-no { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 2px dashed var(--line); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.slot-no.on { border: 0; background: var(--accent); color: var(--accent-ink); }

/* 머리줄 리포트 버튼(글자 포함), 물음표 버튼, 한 번만 뜨는 안내 */
.icon-btn.labeled { width: auto; padding: 0 12px; display: inline-flex; gap: 6px; font-size: .82rem; font-weight: 600; color: inherit; }
.icon-btn.labeled svg { width: 18px; height: 18px; }
.q-btn { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--muted); font-weight: 700; font-size: .85rem; line-height: 1; }
.hint-tip { display: flex; align-items: center; gap: 8px; margin: 8px 2px 0; padding: 8px 8px 8px 12px; border-radius: 10px; background: var(--accent-soft, #e6f4f1); font-size: .82rem; }
.hint-tip span { flex: 1; }
.hint-tip button { border: 0; background: transparent; color: var(--muted); width: 32px; height: 32px; display: grid; place-items: center; }
.hint-tip svg { width: 16px; height: 16px; }
.sheet-head-pad { min-width: 40px; }
.day-sum { display: inline-flex; gap: 10px; }
.btn.with-icon { display: inline-flex; align-items: center; gap: 6px; }
.btn.with-icon svg { width: 18px; height: 18px; color: var(--tone); }
details.more-info { font-size: .8rem; color: var(--muted); }
details.more-info summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 4px; }
details.more-info summary::before { content: "?"; display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--line); font-weight: 700; font-size: .72rem; }
details.more-info summary::-webkit-details-marker { display: none; }
details.more-info p { margin: 6px 0 0; line-height: 1.5; }
.onboard-hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 18px; }
.logo-mark { display: inline-grid; border-radius: 30px; box-shadow: 0 10px 24px rgba(160, 90, 60, .18); }
.brand-word { font-family: "Jua", var(--f-body); color: #e0607a; font-weight: 400; }
.onboard-hero .brand-word { font-size: 2.6rem; }
.onboard-hero .brand small { color: var(--muted); }
.face-empty { display: flex; align-items: center; gap: 12px; text-align: left; }
.face-empty svg { flex: none; }
.nav .nav-rec { color: var(--accent); font-weight: 600; justify-content: flex-end; padding-bottom: 6px; }
.rec-fab { width: 54px; height: 54px; margin-top: -24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; border: 4px solid var(--surface); box-shadow: 0 4px 12px rgba(14, 124, 107, .3); }
.nav .nav-rec .rec-fab svg { width: 26px; height: 26px; stroke-width: 2.4; }
.rec-sheet .quick { margin: 0; }
.topbar .icon-btn[aria-current="page"] { color: var(--accent); }
.group-save { display: inline-flex; align-items: center; gap: 4px; font-size: .82rem; }
.group-save svg { width: 15px; height: 15px; }
.viewer-panel .btn svg { width: 16px; height: 16px; vertical-align: -3px; }
/* 색상 범례 */
.lg-sw { width: 12px; height: 12px; border-radius: 4px; background: var(--tone); display: inline-block; flex: none; }
.lg-bar { width: 16px; height: 6px; border-radius: 3px; background: var(--muted); display: inline-block; opacity: .7; }
.lg-bar.v { width: 8px; height: 14px; }
.lg-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
.lg-line { width: 14px; height: 3px; border-radius: 2px; background: var(--muted); display: inline-block; }
.lg-now { width: 2px; height: 14px; background: var(--danger); display: inline-block; }
.legend-rows { display: grid; gap: 6px; margin-top: 10px; font-size: .78rem; }
.legend-rows > div { display: flex; gap: 10px; align-items: baseline; }
.lg-k { flex: none; width: 46px; color: var(--muted); font-weight: 600; }
.legend-rows .legend { color: var(--ink); }
/* 추억 영상 */
.mem-stage { position: relative; display: grid; place-items: center; background: #1b1715; border-radius: 18px; overflow: hidden; }
.mem-stage canvas { display: block; height: min(62vh, 560px); width: auto; aspect-ratio: 9 / 16; max-width: 100%; }
.mem-status { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 12px; font-size: .8rem; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.55)); text-align: center; min-height: 1em; }
.mem-status:empty { display: none; }
.mem-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mem-actions:has(> :only-child) { grid-template-columns: 1fr; }
.mem-actions .btn svg { width: 18px; height: 18px; vertical-align: -4px; }
.mem-suggest { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 0; margin-top: 12px; color: inherit; font: inherit; }
.mem-ic { width: 44px; height: 44px; border-radius: 14px; background: var(--c-photo); color: #fff; display: grid; place-items: center; flex: none; }
.mem-ic svg { width: 24px; height: 24px; }
.mem-full { position: fixed; inset: 0; z-index: 70; background: #1b1715; color: #fff; display: flex; flex-direction: column; gap: 10px; padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px calc(env(safe-area-inset-bottom, 0px) + 14px); overflow-y: auto; }
.mem-top { display: flex; align-items: center; gap: 10px; }
.mem-top .btn { background: rgba(255,255,255,.14); color: #fff; }
.mem-full .mem-stage { flex: 1; min-height: 0; border-radius: 16px; }
.mem-full .mem-stage canvas { height: min(68vh, 640px); }
.mem-full .mem-actions .btn:not(.primary) { background: rgba(255,255,255,.14); color: #fff; }
.mem-moods { justify-content: center; }
.mem-moods .chip { background: rgba(255,255,255,.1); color: #fff; border-color: rgba(255,255,255,.2); }
.mem-moods .chip[aria-pressed="true"] { background: #fff; color: #1b1715; }
.mem-prompt .sheet-body { padding-top: 18px; gap: 16px; }

/* 접종·검진 달력 */
.hc-next { display: grid; gap: 2px; margin-bottom: 10px; }
.hc-next .btn { justify-self: start; margin-top: 6px; }
.hc .hc-day { aspect-ratio: 1; }
.hc-day.open { background: color-mix(in srgb, var(--c-vaccine) 12%, var(--surface)); }
.hc-marks { position: absolute; left: 0; right: 0; bottom: 5px; display: flex; justify-content: center; gap: 3px; }
.hc-m { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--muted); flex: none; }
.hc-m.done { background: var(--ok, #2a9a57); }
.hc-m.start { background: var(--c-vaccine); }
.hc-m.end { background: transparent; box-shadow: inset 0 0 0 2px var(--warn, #c79400); }
.hc-m.end.over { box-shadow: inset 0 0 0 2px var(--danger); }
.hc-sw { --tone: color-mix(in srgb, var(--c-vaccine) 22%, var(--surface)); }
.hc-cap { margin: 10px 2px 6px; }
.hc-day.sel { box-shadow: inset 0 0 0 3px var(--c-vaccine); }

/* 같이 먹여도 될까 */
.cross-opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.cross-opt { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 11px; display: grid; gap: 1px; font: inherit; color: var(--ink); min-height: 52px; }
.cross-opt span { font-size: .74rem; color: var(--muted); }
.cross-opt[aria-pressed="true"] { border-color: var(--c-med); box-shadow: inset 0 0 0 1.5px var(--c-med); background: color-mix(in srgb, var(--c-med) 10%, var(--surface)); }
.cross-res ul { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 4px; font-size: .9rem; }
.cross-res.ok { box-shadow: inset 4px 0 0 var(--c-med); }
.cross-res.danger { box-shadow: inset 4px 0 0 var(--danger); }

.cross-st { display: grid; gap: 5px; }
.cross-head { display: flex; gap: 12px; align-items: center; }
.cross-head > div { display: grid; gap: 2px; } .cross-head b { font-size: 1.08rem; line-height: 1.35; }
.cross-ic { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 1.3rem; font-weight: 800; color: #fff; background: var(--muted); }
.cross-ic.ok { background: var(--ok); } .cross-ic.danger { background: var(--danger); } .cross-ic.warn { background: var(--warn); }
.cross-time { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--warn-soft); display: grid; gap: 2px; }
.cross-time b { font-size: 1.25rem; } .cross-time span { font-size: .84rem; color: var(--muted); }

<script>/* ---- 00-util.js ---- */
'use strict';
/* ===== 공통 도구 ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const pad = (n) => String(n).padStart(2, '0');
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const round1 = (v) => Math.round(v * 10) / 10;
const MIN = 60000, HOUR = 3600000, DAY = 86400000;
const WD = ['일', '월', '화', '수', '목', '금', '토'];

function dayStart(ts) { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }
function addDays(ts, n) { const d = new Date(ts); d.setDate(d.getDate() + n); return d.getTime(); }
function sameDay(a, b) { return dayStart(a) === dayStart(b); }
function fmtTime(ts) {
  const d = new Date(ts); const h = d.getHours();
  return `${h < 12 ? '오전' : '오후'} ${h % 12 === 0 ? 12 : h % 12}:${pad(d.getMinutes())}`;
}
function fmtHM(ts) { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtDate(ts, withYear = false) {
  const d = new Date(ts);
  return `${withYear ? d.getFullYear() + '년 ' : ''}${d.getMonth() + 1}월 ${d.getDate()}일 (${WD[d.getDay()]})`;
}
function fmtShortDate(ts) { const d = new Date(ts); return `${d.getMonth() + 1}/${d.getDate()}`; }
function fmtYMD(ts) { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function fmtDot(ts) { const d = new Date(ts); return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}`; }
function parseYMD(s) { if (!s) return null; const [y, m, d] = s.split('-').map(Number); if (!y || !m || !d) return null; return new Date(y, m - 1, d).getTime(); }
function toLocalInput(ts) { const d = new Date(ts); return `${fmtYMD(ts)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fromLocalInput(s) { if (!s) return null; const t = new Date(s).getTime(); return isNaN(t) ? null : t; }
function fmtDur(ms) {
  if (ms == null || ms < 0) return '';
  const m = Math.round(ms / MIN);
  if (m === 0 && ms > 0) return '1분 미만';
  if (m < 60) return `${m}분`;
  const h = Math.floor(m / 60), mm = m % 60;
  if (h < 24) return mm ? `${h}시간 ${mm}분` : `${h}시간`;
  const d = Math.floor(h / 24), hh = h % 24;
  return hh ? `${d}일 ${hh}시간` : `${d}일`;
}
function fmtClock(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  return h ? `${h}:${pad(m)}:${pad(ss)}` : `${pad(m)}:${pad(ss)}`;
}
function ago(ts, now = Date.now()) {
  const diff = now - ts;
  if (diff < MIN) return '방금 전';
  if (diff < 0) return fmtTime(ts);
  return fmtDur(diff) + ' 전';
}
function fmtNum(v, digits = 1) { if (v == null || isNaN(v)) return '-'; return Number(v).toFixed(digits).replace(/\.0+$/, ''); }

/* 나이 */
function ageParts(birthTs, at = Date.now()) {
  const b = new Date(birthTs), a = new Date(at);
  let months = (a.getFullYear() - b.getFullYear()) * 12 + (a.getMonth() - b.getMonth());
  let days = a.getDate() - b.getDate();
  if (days < 0) { months -= 1; const prev = new Date(a.getFullYear(), a.getMonth(), 0).getDate(); days += prev; }
  const totalDays = Math.floor((dayStart(at) - dayStart(birthTs)) / DAY);
  return { months: Math.max(0, months), days: Math.max(0, days), totalDays, dayCount: totalDays + 1 };
}
function ageText(birthTs, at = Date.now()) {
  const p = ageParts(birthTs, at);
  if (p.totalDays < 0) return `출산 예정 D-${-p.totalDays}`;
  if (p.months < 1) return `생후 ${p.totalDays}일`;
  if (p.months < 24) return `${p.months}개월 ${p.days}일`;
  return `만 ${Math.floor(p.months / 12)}세 ${p.months % 12}개월`;
}
function ageShort(birthTs, at = Date.now()) { const p = ageParts(birthTs, at); return p.months < 1 ? '신생아' : p.months < 24 ? `${p.months}개월` : `${Math.floor(p.months / 12)}세`; }
function ageMonthsFloat(birthTs, at = Date.now()) { return (at - birthTs) / DAY / 30.4375; }

/* 수학 */
function normCdf(z) {
  // Abramowitz-Stegun 근사
  const t = 1 / (1 + 0.2316419 * Math.abs(z));
  const d = 0.3989423 * Math.exp(-z * z / 2);
  let p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
  return z > 0 ? 1 - p : p;
}
const Z_OF_P = { 3: -1.880794, 15: -1.036433, 50: 0, 85: 1.036433, 97: 1.880794 };

function svgIcon(name) { return ICONS[name] || ICONS.etc; }

async function sha256(text) {
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    let h = 5381; for (const c of text) h = ((h << 5) + h + c.charCodeAt(0)) | 0; return 'djb' + h;
  }
}

function offsetFrom(ts, o) {
  if (!o) return ts;
  const d = new Date(ts);
  if (o.m) d.setMonth(d.getMonth() + o.m);
  if (o.d) d.setDate(d.getDate() + o.d);
  return d.getTime();
}

function feverLevel(t) {
  if (t == null) return { key: 'none', text: '-', cls: '' };
  if (t >= 39) return { key: 'high', text: '고열', cls: 'danger' };
  if (t >= 38) return { key: 'fever', text: '열나요', cls: 'danger' };
  if (t >= 37.5) return { key: 'mild', text: '미열', cls: 'warn' };
  if (t < 35.5) return { key: 'low', text: '저체온', cls: 'warn' };
  return { key: 'ok', text: '정상', cls: 'ok' };
}

/* 기록 한 줄 요약 */
function recTitle(r) {
  const d = r.data || {};
  switch (r.type) {
    case 'breast': {
      const L = d.left || 0, R = d.right || 0;
      return L && R ? '양쪽 모유' : L ? '왼쪽 모유' : R ? '오른쪽 모유' : '모유';
    }
    case 'diaper': return d.kind === '대변' ? '대변' : d.kind === '둘 다' ? '소변+대변' : '소변';
    case 'sleep': return d.kind || '수면';
    case 'med': return d.name || (d.ingredient ? FEVER_MEDS[d.ingredient]?.name : '') || d.category || '투약';
    case 'temp': return `체온 ${fmtNum(r.value)}℃`;
    case 'vaccine': return d.name ? `${d.name}${d.dose ? ' ' + d.dose + '차' : ''}` : '예방접종';
    case 'hospital': return d.place || (d.visit ? '병원 ' + d.visit : '병원');
    case 'growth': return '성장 기록';
    case 'diary': return d.title || '육아일기';
    case 'photo': return d.title || `사진 ${(r.photoIds || []).length}장`;
    case 'symptom': return (d.kinds || []).join(', ') || '증상';
    case 'etc': return (d.kinds || [])[0] || '기타';
    default: return typeName(r);
  }
}
function recDetail(r) {
  const d = r.data || {}; const parts = [];
  if (r.type === 'breast') {
    const L = d.left || 0, R = d.right || 0;
    if (L && R) parts.push(`왼쪽 ${L}분 · 오른쪽 ${R}분 · 총 ${L + R}분`);
    else if (L || R) parts.push(`${L || R}분`);
    else if (r.end) parts.push(fmtDur(r.end - r.start));
  } else if (r.type === 'temp') {
    parts.push(`${d.site || ''} ${feverLevel(r.value).text}`.trim());
  } else if (r.type === 'med') {
    if (r.value) parts.push(`${fmtNum(r.value)}${r.unit || 'mL'}`);
    if (d.ingredient && d.name) parts.push(FEVER_MEDS[d.ingredient]?.name);
    if (d.form) parts.push(d.form);
  } else if (r.type === 'growth') {
    if (d.weight) parts.push(`${fmtNum(d.weight, 2)}kg`);
    if (d.height) parts.push(`${fmtNum(d.height)}cm`);
    if (d.head) parts.push(`머리 ${fmtNum(d.head)}cm`);
  } else if (r.type === 'hospital') {
    if (d.diagnosis) parts.push(d.diagnosis);
    if (d.visit) parts.push(d.visit);
  } else {
    if (r.type === 'pump' && (d.leftMl || d.rightMl)) parts.push(`왼쪽 ${fmtNum(d.leftMl || 0, 0)} · 오른쪽 ${fmtNum(d.rightMl || 0, 0)} · 총 ${fmtNum(r.value || 0, 0)}ml`);
    else if (r.value != null && r.value !== '' && TYPES[r.type]?.amount) parts.push(`${fmtNum(r.value)}${r.unit || TYPES[r.type].amount.unit}`);
    if (r.type === 'pump' && (d.store === '냉장' || d.store === '냉동')) parts.push(`${d.store} 보관`);
    if (r.type === 'pumped' && (d.from === '냉장' || d.from === '냉동')) parts.push(`${d.from} 모유`);
    if (TYPES[r.type]?.kinds && r.type !== 'symptom' && r.type !== 'etc' && (d.kinds || []).length) parts.push(d.kinds.join(', '));
    if (r.type === 'symptom' && d.level) parts.push(d.level);
    if (TYPES[r.type]?.kind === 'duration' && r.end) parts.push(fmtDur(r.end - r.start));
    if (TYPES[r.type]?.kind === 'duration' && !r.end) parts.push('진행 중');
  }
  if ((d.tags || []).length) parts.push(d.tags.join(', '));
  if (r.memo) parts.push(r.memo);
  return parts.filter(Boolean).join(' · ');
}

/* ---- 05-store.js ---- */
/* ===== 저장소: IndexedDB (안 되면 메모리) ===== */
const STORES = ['children', 'records', 'supplies', 'photos', 'kv'];
const DB = {
  db: null, mem: null, opening: null, failed: false,
  _openOnce() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('yuamoa', 1); let done = false;
      r.onupgradeneeded = () => { const d = r.result; STORES.forEach((s) => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); }); };
      r.onsuccess = () => {
        done = true; const d = r.result;
        // 휴대폰 브라우저가 연결을 닫거나(백그라운드 전환 등) 다른 창이 업그레이드하면 다음 저장 때 다시 연다
        d.onclose = () => { if (this.db === d) this.db = null; };
        d.onversionchange = () => { try { d.close(); } catch (e) { /* 무시 */ } if (this.db === d) this.db = null; };
        res(d);
      };
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('blocked'));
      setTimeout(() => { if (!done) rej(new Error('timeout')); }, 4000);
    });
  },
  async open() {
    try {
      if (!('indexedDB' in window)) throw new Error('no idb');
      this.db = await this._openOnce();
      try { navigator.storage?.persist?.(); } catch (e) { /* 무시 */ }
    } catch (e) {
      console.warn('IndexedDB 사용 불가, 메모리 저장으로 동작', e);
      this.toMemory();
    }
  },
  /* 연결이 끊겼으면 다시 연다. 여러 저장이 동시에 와도 한 번만 연다 */
  async ensure() {
    if (this.db || this.mem) return;
    if (!this.opening) this.opening = this._openOnce().then((d) => { this.db = d; }).finally(() => { this.opening = null; });
    await this.opening;
  },
  /* 다시 열 수도 없으면 지금 화면에 있는 데이터를 그대로 들고 메모리 저장으로 전환 */
  toMemory() {
    this.db = null; this.failed = true; this.mem = {}; STORES.forEach((s) => (this.mem[s] = new Map()));
    try { D.children.forEach((c) => this.mem.children.set(c.id, c)); D.records.forEach((r) => this.mem.records.set(r.id, r)); D.supplies.forEach((x) => this.mem.supplies.set(x.id, x)); Object.entries(D.kv).forEach(([k, v]) => this.mem.kv.set(k, { id: k, v })); } catch (e) { /* 무시 */ }
  },
  get persistent() { return !!this.db || (!this.mem && !this.failed); },
  _isClosed(e) { const m = String(e && (e.message || e.name) || ''); return e?.name === 'InvalidStateError' || /clos|connection|lost/i.test(m); },
  /* 실제 작업: 연결이 닫혀 있다는 오류면 다시 열고 한 번 더 시도 */
  async _run(store, mode, work) {
    for (let attempt = 0; attempt < 3; attempt++) {
      if (this.mem) return work(null);
      try {
        await this.ensure();
        if (this.mem) return work(null);
        return await new Promise((res, rej) => {
          let tx; try { tx = this.db.transaction(store, mode); } catch (e) { rej(e); return; }
          const out = work(tx.objectStore(store));
          tx.oncomplete = () => res(out && out.req ? out.req.result : undefined); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error('aborted'));
        });
      } catch (e) {
        if (!this._isClosed(e) || attempt === 2) {
          if (this._isClosed(e)) { console.warn('저장소 다시 열기 실패, 메모리로 전환', e); this.toMemory(); toast('이 화면에서는 저장소가 자꾸 끊겨요. 기록은 유지되지만 백업을 해 두세요'); return work(null); }
          throw e;
        }
        try { this.db && this.db.close(); } catch (er) { /* 무시 */ }
        this.db = null; await new Promise((r) => setTimeout(r, 150 * (attempt + 1)));
      }
    }
  },
  all(store) { return this._run(store, 'readonly', (s) => (s ? { req: s.getAll() } : null)).then((r) => (this.mem ? Array.from(this.mem[store].values()) : r || [])); },
  get(store, id) { return this._run(store, 'readonly', (s) => (s ? { req: s.get(id) } : null)).then((r) => (this.mem ? this.mem[store].get(id) : r)); },
  put(store, obj) { return this._run(store, 'readwrite', (s) => { if (s) s.put(obj); else this.mem[store].set(obj.id, obj); return null; }); },
  putMany(store, list) { if (!list.length) return Promise.resolve(); return this._run(store, 'readwrite', (s) => { list.forEach((o) => (s ? s.put(o) : this.mem[store].set(o.id, o))); return null; }); },
  del(store, id) { return this._run(store, 'readwrite', (s) => { if (s) s.delete(id); else this.mem[store].delete(id); return null; }); },
  clear(store) { return this._run(store, 'readwrite', (s) => { if (s) s.clear(); else this.mem[store].clear(); return null; }); },
};

/* 메모리 캐시 */
const D = { children: [], records: [], supplies: [], kv: {} };

async function loadAll() {
  await DB.open();
  D.children = (await DB.all('children')).filter((c) => !c.deleted);
  D.records = await DB.all('records');
  D.supplies = (await DB.all('supplies')).filter((s) => !s.deleted);
  const kv = await DB.all('kv'); D.kv = {}; kv.forEach((x) => (D.kv[x.id] = x.v));
  D.children.sort((a, b) => a.createdAt - b.createdAt);
}
/* 가족 공유 때 함께 맞출 설정 */
const SHARED_KV = ['timers', 'devChecks', 'devAns', 'tagPresets', 'kindPresets', 'milkDiscard'];
async function setKV(key, v, { fromSync = false } = {}) {
  D.kv[key] = v; await DB.put('kv', { id: key, v });
  if (!fromSync && SHARED_KV.includes(key)) { const st = { ...(D.kv.kvStamp || {}) }; st[key] = Date.now(); D.kv.kvStamp = st; await DB.put('kv', { id: 'kvStamp', v: st }); markDirty('kv', key); }
}
/* 변경 알림: 가족 공유가 켜져 있으면 보낼 목록에 올린다 */
function markDirty(kind, id) { if (typeof Sync !== 'undefined') Sync.queue(kind, id); }
function syncOn() { return !!(D.kv.sync && D.kv.sync.familyId); }
function kv(key, def) { return D.kv[key] === undefined ? def : D.kv[key]; }

function activeChild() { return D.children.find((c) => c.id === D.kv.activeChildId) || D.children[0] || null; }
function childRecs(cid = activeChild()?.id) {
  return D.records.filter((r) => !r.deleted && r.childId === cid && r.type !== 'comment').sort((a, b) => a.start - b.start); // 댓글·하트는 기록 목록에서 뺌
}

/* 사진 */
const PhotoCache = {
  urls: new Map(),
  async url(id) {
    if (this.urls.has(id)) return this.urls.get(id);
    const p = await DB.get('photos', id); if (!p) return null;
    const u = URL.createObjectURL(p.blob); this.urls.set(id, u); return u;
  },
  drop(id) { const u = this.urls.get(id); if (u) URL.revokeObjectURL(u); this.urls.delete(id); },
};
async function compressImage(file, max = 1280) {
  const bmpUrl = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = bmpUrl; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(img, 0, 0, w, h);
    const blob = await new Promise((res) => cv.toBlob(res, 'image/jpeg', 0.82));
    return { blob: blob || file, w, h };
  } finally { URL.revokeObjectURL(bmpUrl); }
}
async function addPhoto(file, childId) {
  const { blob, w, h } = await compressImage(file);
  const p = { id: uid(), childId, blob, w, h, createdAt: Date.now() };
  await DB.put('photos', p); markDirty('photo', p.id); return p.id;
}
/* 화면에 들어간 <img data-photo="id">를 채운다 */
async function hydratePhotos(root = document) {
  for (const img of $$('img[data-photo]', root)) {
    if (img.dataset.loaded) continue;
    const u = await PhotoCache.url(img.dataset.photo);
    if (u) { img.src = u; img.dataset.loaded = '1'; }
  }
  for (const au of $$('audio[data-audio]', root)) {
    if (au.dataset.loaded) continue;
    const u = await PhotoCache.url(au.dataset.audio);
    if (u) { au.src = u; au.dataset.loaded = '1'; }
  }
}

/* ===== 백업 ===== */
const blobToDataURL = (b) => new Promise((res) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(b); });
async function dataURLToBlob(u) {
  const [head, b64] = u.split(','); const mime = (head.match(/data:([^;]+)/) || [])[1] || 'image/jpeg';
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

/* ===== 계산 로직 (화면과 분리, 테스트 대상) ===== */

/* --- 성장 (WHO LMS) --- */
function lmsAt(metric, sex, months) {
  const t = WHO_LMS[`${metric}_${sex === 'F' ? 'F' : 'M'}`];
  if (!t || months < 0 || months > 60) return null;
  const i = Math.min(59, Math.floor(months)), f = months - i;
  const a = t[i], b = t[i + 1];
  return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
}
function zOf(x, [L, M, S]) { return L ? (Math.pow(x / M, L) - 1) / (L * S) : Math.log(x / M) / S; }
function valAtZ(z, [L, M, S]) { return L ? M * Math.pow(1 + L * S * z, 1 / L) : M * Math.exp(S * z); }
function growthPct(metric, sex, months, x) {
  const lms = lmsAt(metric, sex, months); if (!lms || !x) return null;
  const z = zOf(x, lms); return { z, p: clamp(normCdf(z) * 100, 0.1, 99.9) };
}
function latestGrowth(cid, key) {
  const l = recsOfType('growth', cid).filter((r) => r.data && r.data[key]);
  return l[l.length - 1] || null;
}
function currentWeight(child) {
  const g = latestGrowth(child.id, 'weight');
  return g ? g.data.weight : (child.birthWeight || null);
}

/* --- 해열제 --- */
function feverMedRecs(cid) { return recsOfType('med', cid).filter((r) => r.data && FEVER_MEDS[r.data.ingredient]); }
function feverMedStatus(cid, now = Date.now()) {
  const meds = feverMedRecs(cid).filter((r) => r.start <= now);
  const recent = meds.filter((r) => now - r.start < DAY);
  const groups = [['aap', '아세트아미노펜 계열'], ['nsaid', '이부·덱시부프로펜 계열']].map(([g, label]) => {
    const same = meds.filter((r) => FEVER_MEDS[r.data.ingredient].group === g);
    const other = meds.filter((r) => FEVER_MEDS[r.data.ingredient].group !== g);
    const rule = g === 'aap' ? FEVER_MEDS.aap : FEVER_MEDS.ibu;
    const last = same[same.length - 1] || null, lastOther = other[other.length - 1] || null;
    let next = 0, reason = '';
    if (last) { next = last.start + rule.interval * HOUR; reason = `같은 계열 ${rule.interval}시간 간격`; }
    if (lastOther && lastOther.start + CROSS_GAP_H * HOUR > next) { next = lastOther.start + CROSS_GAP_H * HOUR; reason = `다른 계열과 ${CROSS_GAP_H}시간 간격`; }
    const in24 = same.filter((r) => now - r.start < DAY);
    if (in24.length >= rule.maxCount) { const t = in24[in24.length - rule.maxCount].start + DAY; if (t > next) { next = t; reason = `24시간 최대 ${rule.maxCount}회`; } }
    return { group: g, label, last, next, ready: next <= now, reason, count: in24.length, max: rule.maxCount };
  });
  return { active: recent.length > 0, groups };
}
function doseRef(ingredient, weightKg, conc) {
  const m = FEVER_MEDS[ingredient];
  if (!m || !weightKg || m.mgMin == null) return null;
  const c = conc || m.conc;
  const mgMin = m.mgMin * weightKg, mgMax = m.mgMax * weightKg;
  return { mgMin, mgMax, mlMin: mgMin / c, mlMax: mgMax / c, conc: c, dayMaxMg: m.maxMgKgDay ? m.maxMgKgDay * weightKg : null };
}
/* 한 번 먹인 양(mg). mL이면 기록의 농도(없으면 성분 기본 농도)로 환산 */
function medMg(r) {
  const m = FEVER_MEDS[r.data?.ingredient]; if (!m || !r.value) return null;
  const u = r.unit || 'mL';
  if (u === 'mg') return +r.value;
  if (u === 'mL') return +r.value * (r.data.conc || m.conc);
  return null;
}
/* 같은 약을 다시 기록할 때 채울 지난 기록: 제품명 → 성분 → 약 종류 순으로 찾음 */
function lastMedLike(cid, { name, ingredient, category } = {}) {
  const l = recsOfType('med', cid);
  const pick = (f) => { for (let i = l.length - 1; i >= 0; i--) if (f(l[i].data || {})) return l[i]; return null; };
  return (name && pick((d) => d.name === name)) || (ingredient && pick((d) => d.ingredient === ingredient)) || (category && pick((d) => d.category === category)) || null;
}
/* 투약 기록을 저장하기 전 확인 문구 (level: danger면 저장 전 한 번 더 확인) */
function medWarnings(draft, child, now = Date.now()) {
  const out = []; const d = draft.data || {};
  const named = d.category === '해열제' ? ingredientFromName(d.name) : null;
  if (named && d.ingredient && named !== d.ingredient)
    out.push({ level: 'danger', text: `제품명 "${d.name}"은(는) ${FEVER_MEDS[named].name} 성분이에요. 고른 성분(${FEVER_MEDS[d.ingredient]?.name || '-'})과 달라요. 약통 라벨을 확인하세요.` });
  const m = FEVER_MEDS[d.ingredient];
  if (!m) return out;
  const at = draft.start || now;
  const ageM = ageMonthsFloat(child.birth, at);
  if (ageM < m.minAgeM) out.push({ level: 'danger', text: m.minAgeNote });
  const all = feverMedRecs(child.id).filter((r) => r.id !== draft.id);
  const meds = all.filter((r) => r.start <= at);
  const later = all.filter((r) => r.start > at);
  const same = meds.filter((r) => FEVER_MEDS[r.data.ingredient].group === m.group);
  const other = meds.filter((r) => FEVER_MEDS[r.data.ingredient].group !== m.group);
  const lastSame = same[same.length - 1], lastOther = other[other.length - 1];
  if (lastSame && at - lastSame.start < m.interval * HOUR) out.push({ level: 'danger', text: `같은 계열 해열제를 ${fmtDur(at - lastSame.start) || '방금'} 전(${fmtTime(lastSame.start)})에 먹었어요. 최소 ${m.interval}시간 간격을 두세요.${lastSame.data.ingredient !== d.ingredient ? ' 이부프로펜과 덱시부프로펜은 같은 계열이에요.' : ''}` });
  if (lastOther && at - lastOther.start < CROSS_GAP_H * HOUR) out.push({ level: 'warn', text: `다른 계열 해열제를 ${fmtDur(at - lastOther.start) || '방금'} 전(${fmtTime(lastOther.start)})에 먹었어요. 교차 복용은 최소 ${CROSS_GAP_H}시간 간격을 두세요.` });
  const nextSame = later.find((r) => FEVER_MEDS[r.data.ingredient].group === m.group);
  if (nextSame && nextSame.start - at < m.interval * HOUR) out.push({ level: 'danger', text: `이 시각 ${fmtDur(nextSame.start - at)} 뒤(${fmtTime(nextSame.start)})에 같은 계열을 먹인 기록이 있어요. 시각이 맞는지 확인하세요.` });
  const nextOther = later.find((r) => FEVER_MEDS[r.data.ingredient].group !== m.group);
  if (nextOther && nextOther.start - at < CROSS_GAP_H * HOUR) out.push({ level: 'warn', text: `이 시각 ${fmtDur(nextOther.start - at)} 뒤(${fmtTime(nextOther.start)})에 다른 계열을 먹인 기록이 있어요.` });
  const in24 = same.filter((r) => at - r.start < DAY);
  if (in24.length >= m.maxCount) out.push({ level: 'danger', text: `최근 24시간 동안 같은 계열을 이미 ${in24.length}회 먹었어요(최대 ${m.maxCount}회). ${fmtTime(in24[in24.length - m.maxCount].start + DAY)}부터 먹일 수 있어요.` });
  const w = currentWeight(child);
  const ref = doseRef(d.ingredient, w, d.conc);
  const unit = draft.unit || 'mL';
  if (ref && draft.value) {
    if (unit === 'mL' && draft.value > ref.mlMax * 1.1) out.push({ level: 'danger', text: `입력한 ${fmtNum(draft.value)}mL는 체중 ${fmtNum(w, 2)}kg 기준 1회 참고 용량(${fmtNum(ref.mlMin)}~${fmtNum(ref.mlMax)}mL)보다 많아요.` });
    if (unit === 'mg' && draft.value > ref.mgMax * 1.1) out.push({ level: 'danger', text: `입력한 ${fmtNum(draft.value, 0)}mg은 체중 ${fmtNum(w, 2)}kg 기준 1회 참고 용량(${fmtNum(ref.mgMin, 0)}~${fmtNum(ref.mgMax, 0)}mg)보다 많아요.` });
    if (ref.dayMaxMg) {
      const mine = medMg(draft);
      const sameIng = all.filter((r) => r.data.ingredient === d.ingredient && Math.abs(at - r.start) < DAY && r.start <= at);
      const total = sameIng.reduce((a, r) => a + (medMg(r) || 0), 0) + (mine || 0);
      if (mine && total > ref.dayMaxMg) out.push({ level: 'danger', text: `이번까지 24시간 동안 ${m.name} 총 ${fmtNum(total, 0)}mg이에요. 체중 기준 하루 최대(${fmtNum(ref.dayMaxMg, 0)}mg)를 넘어요.` });
    }
  }
  return out;
}

/* --- 접종·검진 일정 --- */
function scheduleItems(child, kind = 'vaccine', now = Date.now()) {
  const list = kind === 'vaccine' ? VACCINES : CHECKUPS;
  const recs = kind === 'vaccine' ? recsOfType('vaccine', child.id) : recsOfType('hospital', child.id).filter((r) => r.data?.checkupKey);
  const done = new Map(); recs.forEach((r) => done.set(kind === 'vaccine' ? r.data?.key : r.data.checkupKey, r));
  return list.map((it) => {
    let from = offsetFrom(child.birth, it.from), to = offsetFrom(child.birth, it.to);
    if (it.after && done.get(it.after.key)) { const base = done.get(it.after.key).start; from = offsetFrom(base, it.after.from); to = offsetFrom(base, it.after.to); }
    const rec = done.get(it.key) || null;
    let status;
    if (rec) status = 'done';
    else if (now > to) status = 'overdue';
    else if (now >= from) status = 'due';
    else if (from - now < 31 * DAY) status = 'soon';
    else status = 'later';
    return { ...it, fromTs: from, toTs: to, rec, status };
  });
}
const SCHED_LABEL = { done: ['완료', 'ok'], overdue: ['시기 지남', 'danger'], due: ['지금 접종 시기', 'accent'], soon: ['곧', 'warn'], later: ['예정', ''] };

/* --- 일별 통계 --- */
function overlap(a1, a2, b1, b2) { return Math.max(0, Math.min(a2, b2) - Math.max(a1, b1)); }
function dailyStats(cid, fromDay, days, now = Date.now()) {
  const recs = childRecs(cid);
  const out = [];
  for (let i = 0; i < days; i++) {
    const s = addDays(fromDay, i), e = addDays(fromDay, i + 1);
    const day = { date: s, feedCount: 0, feedMl: 0, breastMin: 0, breastCount: 0, solid: 0, milkMl: 0, waterMl: 0, sleepMin: 0, napMin: 0, nightMin: 0, pee: 0, poo: 0, diaper: 0, tempMax: null, medCount: 0 };
    for (const r of recs) {
      const end = r.end || (TYPES[r.type]?.kind === 'duration' && !r.end ? Math.min(now, r.start + 12 * HOUR) : r.start);
      if (r.type === 'sleep') {
        const m = overlap(r.start, end, s, e) / MIN; day.sleepMin += m;
        if (r.data?.kind === '밤잠') day.nightMin += m; else day.napMin += m; continue;

    g += `<polyline fill="none" stroke="${col}" stroke-width="${strong ? 1.8 : 1.3}" points="${l.arr.map(([m, v]) => `${x(m).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}"/>`;
    const last = l.arr[l.arr.length - 1]; g += `<text x="${W - R + 3}" y="${y(last[1]) + 3}">${l.p}</text>`;
  });
  const c = `var(--c-growth)`;
  if (pts.length > 1) g += `<polyline fill="none" stroke="${c}" stroke-width="2.2" points="${pts.map((p) => `${x(p.m).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ')}"/>`;
  pts.forEach((p, i) => (g += `<circle cx="${x(p.m)}" cy="${y(p.v)}" r="${i === pts.length - 1 ? 5 : 3.5}" fill="${c}" stroke="var(--surface)" stroke-width="1.5"/>`));
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="성장곡선">${g}</svg>`;
}

/* 하루 시계: 바깥 고리=수면, 가운데=수유·식사, 안쪽=기저귀·건강 */
function dayClock(cid, day) {
  const s = day, e = addDays(day, 1); const recs = recsBetween(s, e, cid); const now = Date.now();
  const C = 160, size = 320; const ang = (ts) => ((ts - s) / DAY) * 2 * Math.PI - Math.PI / 2;
  const pt = (r, a) => [C + r * Math.cos(a), C + r * Math.sin(a)];
  const arc = (r, a1, a2, color, w) => { if (a2 - a1 < 0.01) a2 = a1 + 0.01; const [x1, y1] = pt(r, a1), [x2, y2] = pt(r, a2); const large = a2 - a1 > Math.PI ? 1 : 0; return `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 ${large} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}" stroke="${color}" stroke-width="${w}" fill="none" stroke-linecap="butt"/>`; };
  let g = '';
  [[138, 22], [108, 22], [80, 18]].forEach(([r, w]) => (g += `<circle cx="${C}" cy="${C}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${w}"/>`));
  for (let h = 0; h < 24; h += 3) { const [tx, ty] = pt(156, ang(s + h * HOUR)); g += `<text x="${tx}" y="${ty + 3}" text-anchor="middle">${h}</text>`; }
  for (const r of recs) {
    const t = TYPES[r.type]; if (!t) continue; const col = tone(r.type);
    const st = Math.max(r.start, s), en = Math.min(r.end || (t.kind === 'duration' ? Math.min(now, r.start + 12 * HOUR) : r.start), e);
    if (r.type === 'sleep') g += arc(138, ang(st), ang(en), col, 22);
    else if (t.group === 'feed') { if (t.kind === 'duration' && r.end) g += arc(108, ang(st), ang(en), col, 22); else if (r.start >= s) { const [px, py] = pt(108, ang(r.start)); g += `<circle cx="${px}" cy="${py}" r="6" fill="${col}"/>`; } }
    else if (r.start >= s) { const [px, py] = pt(80, ang(r.start)); g += `<circle cx="${px}" cy="${py}" r="4.5" fill="${col}"/>`; }
  }
  if (sameDay(now, day)) { const [x1, y1] = pt(62, ang(now)), [x2, y2] = pt(150, ang(now)); g += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--danger)" stroke-width="1.5"/>`; }
  const st = dailyStats(cid, day, 1)[0]; const ch = activeChild();
  g += `<text x="${C}" y="${C - 16}" text-anchor="middle" style="font-size:11px">${ch ? 'D+' + ageParts(ch.birth, day).dayCount : ''}</text>
  <text x="${C}" y="${C + 4}" text-anchor="middle" style="fill:var(--ink);font-size:15px;font-weight:600">수면 ${fmtDur(st.sleepMin * MIN) || '0분'}</text>
  <text x="${C}" y="${C + 22}" text-anchor="middle" style="font-size:11px">수유 ${st.feedCount}회 · 기저귀 ${st.diaper}회</text>`;
  // 범례: 고리별로 이날 실제로 있는 종류만 (없으면 대표 종류)
  const present = [...new Set(recs.map((r) => r.type).filter((t) => TYPES[t]))];
  const ring = (pred, dflt) => { const l = present.filter(pred); return l.length ? l : dflt; };
  const rows = [['바깥', ring((t) => t === 'sleep', ['sleep'])], ['가운데', ring((t) => TYPES[t].group === 'feed', ['breast', 'formula'])], ['안쪽', ring((t) => t !== 'sleep' && TYPES[t].group !== 'feed', ['diaper'])]];
  return `<svg class="chart" viewBox="0 0 ${size} ${size}" role="img" aria-label="하루 시계" style="max-width:340px;margin:0 auto">${g}</svg>
  <div class="legend-rows">${rows.map(([k, ts]) => `<div><span class="lg-k">${k}</span><span class="legend">${legendItems(ts)}</span></div>`).join('')}
  <div><span class="lg-k">표시</span><span class="legend"><span><i class="lg-bar"></i>진행 시간</span><span><i class="lg-dot"></i>한 번 기록</span>${sameDay(now, day) ? '<span><i class="lg-now"></i>지금</span>' : ''}</span></div></div>`;
}

/* 주간 패턴: 7일 × 24시간 */
function weekPattern(cid, endDay, types) {
  const days = 7, W = 340, H = 420, L = 26, T = 22, R = 6, B = 6; const colW = (W - L - R) / days;
  const y = (h) => T + (H - T - B) * (h / 24); const now = Date.now(); let g = '';
  for (let h = 0; h <= 24; h += 3) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(h)}" y2="${y(h)}"/><text x="${L - 4}" y="${y(h) + 3}" text-anchor="end">${h}</text>`;
  for (let i = 0; i < days; i++) {
    const d = addDays(endDay, i - days + 1), x = L + i * colW;
    g += `<text x="${x + colW / 2}" y="${T - 8}" text-anchor="middle" style="${sameDay(d, now) ? 'fill:var(--accent);font-weight:700' : ''}">${new Date(d).getDate()}(${WD[new Date(d).getDay()]})</text>`;
    for (const r of recsBetween(d, addDays(d, 1), cid)) {
      if (!types.includes(r.type)) continue; const t = TYPES[r.type];
      const st = Math.max(r.start, d), en = Math.min(r.end || (t.kind === 'duration' ? Math.min(now, r.start + 12 * HOUR) : r.start), addDays(d, 1));
      const h1 = (st - d) / HOUR, h2 = (en - d) / HOUR;
      if (t.kind === 'duration' && h2 - h1 > 0.05) g += `<rect x="${x + 3}" y="${y(h1)}" width="${colW - 6}" height="${Math.max(2, y(h2) - y(h1))}" rx="3" fill="${tone(r.type)}" opacity=".85"/>`;
      else if (r.start >= d) g += `<rect x="${x + 5}" y="${y(h1) - 1.5}" width="${colW - 10}" height="3" rx="1.5" fill="${tone(r.type)}"/>`;
    }
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="주간 패턴">${g}</svg>
  <div class="legend" style="margin-top:8px">${legendItems(types)}</div>
  <div class="legend" style="margin-top:4px"><span><i class="lg-bar v"></i>막대: 진행 시간</span><span><i class="lg-line"></i>가로줄: 한 번 기록</span></div>`;
}
/* 색상 범례: 종류별 색 칸 + 이름 */
function legendItems(types) { return types.filter((t) => TYPES[t]).map((t) => `<span><i class="lg-sw" style="--tone:${tone(t)}"></i>${esc(TYPES[t].name)}</span>`).join(''); }

ACT.timerSide = async (el) => {

/* 타이머 */
function segTotal(t, side) {
  const now = Date.now();
  return (t.segs || []).filter((s) => s.side === side).reduce((a, s) => a + ((s.to || now) - s.from), 0);
}
async function startTimer(type) {
  const child = activeChild(); const list = timers();
  if (list.find((t) => t.childId === child.id && t.type === type)) { toast('이미 진행 중이에요'); return; }
  const now = Date.now();

function tick() {

function newDraft(type) {
  const child = activeChild(); const now = Date.now(); const t = TYPES[type];
  const d = { id: null, childId: child.id, type, start: now, end: null, value: null, unit: t.amount?.unit || null, data: { tags: [], kinds: [] }, memo: '', photoIds: [] };
  const last = lastOf(type, child.id);
  if (t.amount) { d.value = last?.value ?? t.amount.presets[Math.floor(t.amount.presets.length / 2)]; d.unit = last?.unit || t.amount.unit; }
  if (t.select) d.data[t.select.key] = (last?.data?.[t.select.key]) || t.select.options[0];
  if (type === 'sleep') { const h = new Date(now).getHours(); d.data.kind = h >= 19 || h < 6 ? '밤잠' : '낮잠'; }
  if (type === 'temp') { d.value = last && now - last.start < DAY ? last.value : 36.8; d.data.site = last?.data?.site || '귀'; d.unit = '℃'; }
  if (type === 'med') {
    const lf = lastOf('med', child.id);
    d.data = { tags: [], category: lf?.data?.category || '해열제' };
    fillMedFrom(d, lf, lf?.data?.ingredient || 'aap');
  }
  if (type === 'growth') { const w = latestGrowth(child.id, 'weight'), h = latestGrowth(child.id, 'height'), hd = latestGrowth(child.id, 'head'); d.data = { tags: [], weight: w?.data.weight || null, height: h?.data.height || null, head: hd?.data.head || null }; }
  if (type === 'breast') { d.data.left = 0; d.data.right = 0; }
  if (type === 'pump') {
    d.data.store = last?.data?.store || '냉장';
    if (last?.data?.leftMl != null || last?.data?.rightMl != null) { d.data.leftMl = last.data.leftMl || 0; d.data.rightMl = last.data.rightMl || 0; d.value = d.data.leftMl + d.data.rightMl; }
    else { d.data.leftMl = Math.round((d.value || 0) / 2 / 5) * 5; d.data.rightMl = (d.value || 0) - d.data.leftMl; }
  }
  if (type === 'pumped') { const st = milkStash(child.id, now); d.data.from = st['냉장'].ml > 0 ? '냉장' : last?.data?.from && (last.data.from === '방금 유축' || st[last.data.from]?.ml > 0) ? last.data.from : st['냉동'].ml > 0 ? '냉동' : '방금 유축'; } // 냉장 모유가 있으면 먼저(보관 기간이 짧음)
  if (type === 'hospital') { d.data.place = lastOf('hospital', child.id)?.data?.place || ''; }
  return d;
}

/* 육아일기 음성 메모 (최대 1분) */
const VOICE_MAX = 60 * 1000;
function voiceField(r) {
  const ids = r.data.audioIds || [];
  const list = ids.map((id) => `<div class="voice"><audio controls preload="metadata" data-audio="${id}"></audio><button type="button" class="link-btn" data-act="edDelAudio" data-a="${id}">빼기</button></div>`).join('');
  const can = typeof MediaRecorder !== 'undefined' && navigator.mediaDevices?.getUserMedia;
  const ctl = S.rec ? `<button type="button" class="btn block rec-on" data-act="recStop">■ 멈추기 <span class="num" data-tick="${S.rec.start}">0:00</span> / 1:00</button>`
    : can ? btn(`${ICONS.mic} 녹음하기 (최대 1분)`, 'recStart', { cls: 'block' }) : '<span class="small muted">이 브라우저에서는 녹음을 지원하지 않아요.</span>';
  return `<div class="stack" style="gap:8px">${list}${ids.length < 5 ? ctl : '<span class="small muted">음성 메모는 5개까지 붙일 수 있어요.</span>'}<span class="tiny muted">옹알이, 처음 한 말을 녹음해 두세요.</span></div>`;
}
ACT.recStart = async () => {
  if (S.rec) return;
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { toast('마이크를 쓸 수 없어요. 휴대폰 설정에서 마이크를 허용해 주세요'); return; }
  const mime = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].find((m) => MediaRecorder.isTypeSupported?.(m)) || '';
  const mr = new MediaRecorder(stream, { ...(mime ? { mimeType: mime } : {}), audioBitsPerSecond: 32000 });
  const chunks = []; const start = Date.now();
  S.rec = { mr, start, stream };
  mr.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  mr.onstop = async () => {
    const rec = S.rec; S.rec = null; stream.getTracks().forEach((t) => t.stop()); clearTimeout(rec?.timer);
    if (rec?.cancel || !S.editor || !chunks.length) { render(); return; }
    const blob = new Blob(chunks, { type: mr.mimeType || mime || 'audio/webm' });
    const id = uid(); const E = S.editor;
    await DB.put('photos', { id, childId: E.draft.childId, kind: 'audio', mime: blob.type, dur: Date.now() - start, blob, createdAt: Date.now() }); markDirty('photo', id);
    E.draft.data.audioIds = [...(E.draft.data.audioIds || []), id]; (E.newAudios || (E.newAudios = [])).push(id);
    render(); toast(`${Math.round((Date.now() - start) / 1000)}초 녹음했어요`);
  };
  mr.start(1000); S.rec.timer = setTimeout(() => { try { mr.stop(); } catch (e) { /* 무시 */ } }, VOICE_MAX);
  haptic(); render();
};
ACT.recStop = () => { try { S.rec?.mr.stop(); } catch (e) { S.rec = null; render(); } };
ACT.edDelAudio = (el) => { const d = S.editor.draft.data; d.audioIds = (d.audioIds || []).filter((x) => x !== el.dataset.a); render(); };

function justNow(r) { return Math.abs(r.start - Date.now()) < 3 * MIN; }
function pumpFields(r, E) {
  if (E.pumpTotal === undefined) E.pumpTotal = !E.isNew && r.value && r.data.leftMl == null && r.data.rightMl == null;
  let b = '';

/* 지난 기록으로 투약 초안 채우기 (같은 약을 다시 먹일 때 다시 입력하지 않도록) */
function fillMedFrom(d, src, ingredient) {
  const sd = src?.data || {};

  } else delete d.data.ingredient;
  d.data.form = sd.form || '시럽'; d.data.name = sd.name || '';

  d.data.prefillFrom = src ? src.id : null;
}
function medFields(r, child) {
  const d = r.data; let b = ''; const E = S.editor;
