  }
  b += field('약 종류', `<div class="chips">${MED_CATS.map((c) => chip(c, d.category === c, 'edMedCat', c, '', tone('med'))).join('')}</div>`);
  if (fever) {
    b += field('자주 쓰는 해열제', `<div class="chips">${FEVER_PRODUCTS.map((p, i) => chip(p.name + (p.color ? `(${p.color})` : ''), d.name === p.name, 'edProduct', i, '', tone('med'))).join('')}</div><span class="small muted">이름이 비슷해도 성분이 달라요. 챔프 <b>빨강</b>은 아세트아미노펜, 챔프 이부펜 <b>파랑</b>은 이부프로펜이에요.</span>`);
    b += field('성분', `<div class="chips">${Object.entries(FEVER_MEDS).map(([k, m]) => chip(m.name, d.ingredient === k, 'edIngredient', k, '', tone('med'))).join('')}</div><span class="small muted">${esc(FEVER_MEDS[d.ingredient]?.ex || '')}</span>`);
  }
  b += field('제형', `<div class="chips">${MED_FORMS.map((c) => chip(c, d.form === c, 'edData', 'form', c, tone('med'))).join('')}</div>`);
  const mu = r.unit || 'mL'; const mcfg = mu === 'mL' ? { step: 0.1, max: 30, dec: 1, px: 12, major: 5, label: 10 } : mu === 'mg' ? { step: 5, max: 1000, dec: 0, px: 8, major: 2, label: 10 } : { step: 0.5, max: 10, dec: 1, px: 18, major: 2, label: 2 };
  const prev = d.prefillFrom ? D.records.find((x) => x.id === d.prefillFrom) : null;
  b += field('먹인 양', `${ruler({ id: 'ru-med-' + mu, bind: 'editor.draft.value', value: r.value ?? 0, min: 0, unit: mu, after: 'rerender', ...mcfg })}
    <div class="quick-times">${MED_UNITS.map((u) => chip(u, (r.unit || 'mL') === u, 'edSet', 'unit', u, 'var(--muted)')).join('')}</div>
    ${prev && E?.isNew ? `<span class="small muted prefill-note">지난번과 같은 양으로 채웠어요: ${esc(prev.data?.name || FEVER_MEDS[prev.data?.ingredient]?.name || prev.data?.category || '')} ${fmtNum(prev.value)}${esc(prev.unit || '')} · ${fmtShortDate(prev.start)} ${fmtHM(prev.start)}${prev.by ? ` · ${esc(prev.by)}` : ''}</span>` : ''}`);
  b += field('제품명 (선택)', `<input class="input" id="ed-medname" data-bind="editor.draft.data.name" data-rerender="1" value="${esc(d.name || '')}" placeholder="예: 해열제 시럽">`);
  if (fever && FEVER_MEDS[d.ingredient]) {
    const m = FEVER_MEDS[d.ingredient]; const w = currentWeight(child);
    b += field('시럽 농도 (제품 라벨 확인)', `<div class="unit-row"><input class="input num" type="number" inputmode="decimal" id="ed-conc" data-bind="editor.draft.data.conc" data-kind="num" data-rerender="1" value="${d.conc ?? m.conc}"><span>mg/mL</span></div>`);
    const ref = doseRef(d.ingredient, w, d.conc || m.conc);
    let refHtml = !w ? '아이 몸무게를 성장 기록에 남기면 체중 기준 참고 용량을 보여 드려요.'
      : ref ? `체중 ${fmtNum(w, 2)}kg 기준 1회 참고 용량: <b>${fmtNum(ref.mlMin)}~${fmtNum(ref.mlMax)}mL</b> (${fmtNum(ref.mgMin, 0)}~${fmtNum(ref.mgMax, 0)}mg, ${ref.conc}mg/mL 기준)`
        : '덱시부프로펜은 제품마다 체중별 용량표가 달라요. 제품 설명서의 표를 따르세요.';
    b += `<div class="notice">${refHtml}<br><span class="small muted">일반적인 소아 용량 범위입니다. 제품 설명서와 의사·약사 지시가 항상 우선이에요.</span></div>`;
  }

}
function riskSig(r) { return r.type === 'med' ? medWarnings(r, activeChild()).filter((w) => w.level === 'danger').map((w) => w.text).join('|') : ''; }

/* 편집기 동작 */
ACT.edTime = (el) => {

  r.start = a === 'now' ? Date.now() : r.start + +a * MIN;
  if (dur != null) r.end = r.start + dur;
  render();
};
ACT.edDur = (el) => { const r = S.editor.draft; const m = +el.dataset.a; r.end = m ? r.start + m * MIN : null; render(); };
ACT.edBreast = (el) => { const r = S.editor.draft; const k = el.dataset.a; r.data[k] = Math.max(0, (r.data[k] || 0) + +el.dataset.b); render(); };
ACT.edAmt = (el) => {
  const r = S.editor.draft; const t = TYPES[r.type]; const step = r.type === 'med' ? ((r.unit || 'mL') === 'mL' ? 0.5 : 1) : (t.amount?.step || 10);
  r.value = Math.max(0, round1((+r.value || 0) + +el.dataset.a * step)); render();
};
ACT.edTemp = (el) => { const r = S.editor.draft; r.value = round1(clamp((+r.value || 36.5) + +el.dataset.a, 33, 43)); render(); };
ACT.edSet = (el) => { const r = S.editor.draft; const k = el.dataset.a; const v = el.dataset.b; r[k] = k === 'value' ? +v : v; render(); };
ACT.edMedCat = (el) => {
  const r = S.editor.draft; const c = el.dataset.a; if (r.data.category === c) return;
  r.data.category = c;
  fillMedFrom(r, lastMedLike(r.childId, { category: c }), 'aap'); render();

  const r = S.editor.draft; const k = el.dataset.a; if (r.data.ingredient === k) return;
  const src = lastMedLike(r.childId, { ingredient: k });
  if (src) fillMedFrom(r, src, k);
  else { r.data.ingredient = k; r.data.conc = FEVER_MEDS[k]?.conc || null; if (ingredientFromName(r.data.name) && ingredientFromName(r.data.name) !== k) r.data.name = ''; r.value = null; r.data.prefillFrom = null; }

};

  const src = lastMedLike(r.childId, { name: p.name });
  if (src && src.data?.ingredient === p.ing) fillMedFrom(r, src, p.ing);
  else {
    const same = lastMedLike(r.childId, { ingredient: p.ing });
    r.data.ingredient = p.ing; r.data.conc = p.conc; r.data.name = p.name; r.data.form = '시럽'; r.unit = 'mL';
    const sameConc = same && (same.data?.conc || FEVER_MEDS[p.ing].conc) === p.conc && (same.unit || 'mL') === 'mL';

};

ACT.edDelete = async () => {
  const E = S.editor; if (!E.confirmDel) { E.confirmDel = true; render(); return; }
  await deleteRecord(E.draft.id); S.editor = null; render(); toast('기록을 삭제했어요');
};
ACT.edSave = async () => {
  const E = S.editor; const r = E.draft; const t = TYPES[r.type];
  if (!r.start) { toast('시각을 입력해 주세요'); return; }
  if (r.start > Date.now() + 5 * MIN && r.type !== 'hospital' && r.type !== 'vaccine') { toast('미래 시각으로는 기록할 수 없어요'); return; }
  if (r.end && r.end < r.start) { toast('끝난 시각이 시작보다 빨라요'); return; }
  if (r.type === 'temp' && !(r.value >= 33 && r.value <= 43)) { toast('체온은 33~43℃ 사이로 입력해 주세요'); return; }
  if (r.type === 'growth' && !(r.data.weight || r.data.height || r.data.head)) { toast('몸무게·키·머리둘레 중 하나는 입력해 주세요'); return; }
  if (r.type === 'breast') {
    const m = (r.data.left || 0) + (r.data.right || 0);
    if (m && !r.end) { if (E.isNew && justNow(r)) { r.end = Date.now(); r.start = r.end - m * MIN; } else r.end = r.start + m * MIN; }
  }
  if (r.type === 'pump' && !E.pumpTotal) { r.value = (+r.data.leftMl || 0) + (+r.data.rightMl || 0) || null; }
  if (t.amount || r.type === 'med' || r.type === 'temp') r.value = r.value === '' || r.value == null ? null : +r.value;
  if (r.type === 'med' && r.data.category !== '해열제') delete r.data.ingredient;
  if (r.type === 'med') {
    const sig = riskSig(r);
    if (sig && E.riskOk !== sig) { E.riskOk = sig; render(); toast('주의 문구를 확인해 주세요. 맞으면 저장을 한 번 더 누르세요'); document.querySelector('.med-warn.danger')?.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
    delete r.data.prefillFrom;
  }
  if (r.type === 'vaccine' && !r.data.key) { const v = VACCINES[0]; r.data.key = v.key; r.data.name = v.name; r.data.dose = v.dose; }
  // 빠진 사진은 저장 시 정리
  if (!E.isNew) { const before = D.records.find((x) => x.id === r.id)?.photoIds || []; for (const id of before) if (!r.photoIds.includes(id)) await removePhoto(id); }
  for (const id of E.newPhotos) if (!r.photoIds.includes(id)) await removePhoto(id);
  if (S.rec) { toast('녹음을 먼저 멈춰 주세요'); return; }
  const audioNow = r.data.audioIds || [];
  if (!E.isNew) { const before = D.records.find((x) => x.id === r.id)?.data?.audioIds || []; for (const id of before) if (!audioNow.includes(id)) await removePhoto(id); }
  for (const id of E.newAudios || []) if (!audioNow.includes(id)) await removePhoto(id);
  await saveRecord(r); S.editor = null; render(); toast(`${t.name} 기록을 저장했어요`);
  checkSupplyAlerts(r);
};

/* ---- 10-timeline.js ---- */
/* ===== 타임라인 ===== */
const TL_FILTERS = [['all', '전체'], ['feed', '수유·식사'], ['care', '생활'], ['health', '건강'], ['etc', '기타']];
const GAP_SETS = { feed: { name: '수유', types: FEED_TYPES }, solid: { name: '이유식', types: ['solid'] }, diaper: { name: '기저귀', types: ['diaper'] }, sleep: { name: '수면', types: ['sleep'] }, med: { name: '투약', types: ['med'] } };

function viewTimeline(child) {
  const T = S.tl; const cid = child.id;
  let h = `<div class="stack" style="margin-top:4px">${seg([['list', '목록'], ['clock', '하루 시계'], ['week', '주간 패턴'], ['gap', '간격']], T.mode, 'tlMode')}`;
  const dateNav = (label) => `<div class="spread"><button type="button" class="icon-btn" data-act="tlDay" data-a="-1" aria-label="이전">${ICONS.left}</button>
    <div class="grow" style="text-align:center"><input type="date" id="tl-date" class="input num" style="text-align:center;font-weight:600;min-height:40px;padding:6px" data-change="tlDate" value="${fmtYMD(T.date)}" max="${fmtYMD(Date.now())}" aria-label="날짜 선택"><div class="tiny muted">${label}</div></div>
    <button type="button" class="icon-btn" data-act="tlDay" data-a="1" aria-label="다음" ${dayStart(Date.now()) <= T.date ? 'disabled' : ''}>${ICONS.right}</button></div>`;

  if (T.mode === 'list') {
    h += `<div class="chips">${TL_FILTERS.map(([k, l]) => chip(l, T.filter === k, 'tlFilter', k)).join('')}</div>`;
    const from = addDays(T.date, -6), to = addDays(T.date, 1);
    h += dateNav(`${fmtShortDate(from)} ~ ${fmtDate(T.date)}`) + '</div>';
    let any = false;
    for (let d = T.date; d >= from; d = addDays(d, -1)) {
      const list = childRecs(cid).filter((r) => r.start >= d && r.start < addDays(d, 1) && (T.filter === 'all' || TYPES[r.type]?.group === T.filter)).reverse();
      if (!list.length) continue; any = true;
      const st = dailyStats(cid, d, 1)[0]; const ap = ageParts(child.birth, d);
      h += `<div class="day-head"><span>${fmtDate(d)}${sameDay(d, Date.now()) ? ' <span class="pill accent">오늘</span>' : ''}</span><span class="muted day-sum"><span>수유 ${st.feedCount}회</span><span>수면 ${fmtDur(st.sleepMin * MIN) || '0분'}</span></span></div>`; void ap;
      h += `<div class="rec-list">${list.map((r) => recRow(r)).join('')}</div>`;
    }
    if (!any) h += `<div class="card empty" style="margin-top:12px">이 기간에 기록이 없어요.</div>`;
    return h;
  }
  if (T.mode === 'clock') {
    h += dateNav(fmtDate(T.date, true)) + '</div>';
    h += `<div class="card" style="margin-top:12px">${dayClock(cid, T.date)}</div>`;
    const st = dailyStats(cid, T.date, 1)[0];
    h += `<div class="status-grid" style="margin-top:12px">
      <div class="status"><span class="label">수유</span><span class="val">${st.feedCount}회</span><span class="sub">분유·유축 ${st.feedMl}ml · 모유 ${st.breastMin}분</span></div>
      <div class="status"><span class="label">수면</span><span class="val">${fmtDur(st.sleepMin * MIN) || '0분'}</span><span class="sub">낮잠 ${fmtDur(st.napMin * MIN) || '0분'} · 밤잠 ${fmtDur(st.nightMin * MIN) || '0분'}</span></div>
      <div class="status"><span class="label">기저귀</span><span class="val">${st.diaper}회</span><span class="sub">소변 ${st.pee} · 대변 ${st.poo}</span></div>
      <div class="status"><span class="label">이유식·간식</span><span class="val">${fmtNum(st.solid, 0)}g</span><span class="sub">우유 ${st.milkMl}ml · 물 ${st.waterMl}ml</span></div></div>`;
    return h;
  }
  if (T.mode === 'week') {
    const sel = T.weekTypes || ['sleep', ...FEED_TYPES, 'solid'];
    h += dateNav(`${fmtShortDate(addDays(T.date, -6))} ~ ${fmtShortDate(T.date)}`);
    h += `<div class="chips">${['sleep', 'breast', 'formula', 'pumped', 'solid', 'diaper', 'temp', 'med'].map((t) => chip(TYPES[t].name, sel.includes(t), 'tlWeekType', t, tone(t))).join('')}</div></div>`;
    h += `<div class="card" style="margin-top:12px">${weekPattern(cid, T.date, sel)}</div><p class="tiny muted" style="margin:6px 2px">세로는 하루 0시~24시예요.</p>`;
    return h;
  }
  // 간격
  const gs = GAP_SETS[T.gapType] || GAP_SETS.feed;
  h += `<div class="chips">${Object.entries(GAP_SETS).map(([k, v]) => chip(v.name, T.gapType === k, 'tlGap', k)).join('')}</div></div>`;
  const list = recsOfType(gs.types, cid).filter((r) => r.start >= addDays(dayStart(Date.now()), -6));
  const iv = intervals(list);
  if (!iv.length) return h + `<div class="card empty" style="margin-top:12px">최근 7일 동안 ${gs.name} 기록이 2개 이상 있어야 간격을 볼 수 있어요.</div>`;
  const gaps = iv.map((x) => x.gap); const avg = gaps.reduce((a, b) => a + b, 0) / gaps.length;
  const today = iv.filter((x) => sameDay(x.rec.start, Date.now()));
  h += `<div class="status-grid" style="margin-top:12px"><div class="status"><span class="label">최근 7일 평균 간격</span><span class="val">${fmtDur(avg)}</span><span class="sub">${iv.length + 1}회 기록 기준</span></div>
    <div class="status"><span class="label">마지막 ${gs.name} 이후</span><span class="val">${fmtDur(Date.now() - list[list.length - 1].start)}</span><span class="sub">${fmtTime(list[list.length - 1].start)}</span></div></div>`;
  h += `<p class="small muted" style="margin:10px 2px">오늘 간격: ${today.length ? today.map((x) => fmtDur(x.gap)).join(' → ') : '아직 없음'}</p>`;
  h += `<div class="stack" style="gap:4px">`;
  const rev = iv.slice(-20).reverse();
  rev.forEach((x, i) => {
    h += `<div class="rec-list">${recRow(x.rec, { showDate: true })}</div><span class="pill gap-pill ${x.gap > avg * 1.5 ? 'warn' : ''}">↑ ${fmtDur(x.gap)}</span>`;
    if (i === rev.length - 1) h += `<div class="rec-list">${recRow(x.prev, { showDate: true })}</div>`;
  });
  return h + '</div>';
}

/* --- 진료용 요약 리포트 --- */
/* 리포트용 투약 한 줄: 성분(제품) 양 · mg */
function medLine(m) {
  const d = m.data || {}; const mg = medMg(m);
  const name = d.ingredient ? FEVER_MEDS[d.ingredient].name + (d.name && !d.name.includes(FEVER_MEDS[d.ingredient].name) ? ` (${d.name})` : '') : d.name || d.category || '약';
  const amt = m.value ? `${fmtNum(m.value)}${m.unit || 'mL'}${mg && (m.unit || 'mL') !== 'mg' ? ` (${fmtNum(mg, 0)}mg)` : ''}` : '';
  return [name, amt].filter(Boolean).join(' ') + (d.category && d.category !== '해열제' && d.name ? ` [${d.category}]` : '');
}
function reportModel(child, from, to) {
  const cid = child.id; const recs = recsBetween(from, to, cid);
  const w = latestGrowth(cid, 'weight');
  return {
    child, from, to, weight: w?.data.weight, weightAt: w?.start,
    temps: recs.filter((r) => r.type === 'temp'), meds: recs.filter((r) => r.type === 'med'),
    symptoms: recs.filter((r) => r.type === 'symptom'), hospital: recs.filter((r) => r.type === 'hospital'),
    days: dailyStats(cid, dayStart(from), Math.round((dayStart(to) - dayStart(from)) / DAY) + 1),
    memos: recs.filter((r) => r.memo && !['temp', 'med'].includes(r.type)).slice(-8),
  };
}

  const R = S.report; const now = Date.now();
  const to = Math.min(R.to || now, now), from = R.from || now - (R.hours || 72) * HOUR;

  const sexT = child.sex === 'F' ? '여아' : child.sex === 'M' ? '남아' : '';
  let h = pageHead('진료용 요약 리포트') + `<div class="stack"><div class="no-print">${seg([[24, '24시간'], [48, '48시간'], [72, '72시간'], [168, '7일']], R.from ? '' : (R.hours || 72), 'repHours')}</div>`;
  h += `<div class="report" id="report"><div class="rh"><div><b style="font-size:1.1rem">${esc(child.name)}</b> <span class="muted">${sexT} · ${ageText(child.birth, to)} · ${fmtDot(child.birth)}생</span></div><div class="small muted">${fmtShortDate(from)} ${fmtHM(from)} ~ ${fmtShortDate(to)} ${fmtHM(to)}</div></div>

async function drawSticker(cv = $('#stk-cv')) {
  const st = S.form.sticker; if (!cv || !st) return null;
  const p = await DB.get('photos', st.photo); if (!p) return null;
  const child = activeChild(); const r = D.records.find((x) => x.id === st.rec); const info = stickerInfo(child, r ? r.start : Date.now());
  const url = URL.createObjectURL(p.blob);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const W = img.naturalWidth, H = img.naturalHeight; cv.width = W; cv.height = H;
    const g = cv.getContext('2d'); g.drawImage(img, 0, 0, W, H);
    const u = Math.min(W, H) / 100; const font = (px, w = 700) => `${w} ${Math.round(px * u)}px "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif`;
    const big = st.show.day && info.day ? info.day : ''; const ms = info.milestone && st.show.day ? info.milestone : '';
    const parts1 = [st.show.age && info.age, st.show.date && info.date].filter(Boolean);
    const parts2 = [st.show.weight && info.weight ? `${fmtNum(info.weight, 2)}kg` : '', st.show.height && info.height ? `${fmtNum(info.height)}cm` : ''].filter(Boolean);
    const note = (st.text || '').trim();
    if (st.style === 'band') {
      const bh = 26 * u; const gr = g.createLinearGradient(0, H - bh * 1.6, 0, H); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.62)');
      g.fillStyle = gr; g.fillRect(0, H - bh * 1.6, W, bh * 1.6);
      g.fillStyle = '#fff'; g.textBaseline = 'alphabetic'; g.shadowColor = 'rgba(0,0,0,.35)'; g.shadowBlur = 2 * u;
      g.font = font(11); g.textAlign = 'left'; g.fillText([big, ms].filter(Boolean).join(' · ') || note, 5 * u, H - 11 * u);
      g.font = font(4.6, 600); g.fillText([...parts1, ...(big || ms ? [note] : [])].filter(Boolean).join('  ·  '), 5 * u, H - 4.5 * u);
      g.textAlign = 'right'; g.font = font(6.2); g.fillText(parts2.join('  '), W - 5 * u, H - 11 * u);
    } else if (st.style === 'badge') {
      const lines = [[big || ms, 9], [ms && big ? ms : '', 4.6], [parts1.join(' · '), 4.2], [parts2.join(' · '), 5], [note, 4.4]].filter((l) => l[0]);
      g.font = font(9); let w = 0; for (const [t, sz] of lines) { g.font = font(sz); w = Math.max(w, g.measureText(t).width); }
      const pad = 4 * u, lh = (sz) => sz * u * 1.25; const bh = lines.reduce((a, l) => a + lh(l[1]), 0) + pad * 1.6; const bw = w + pad * 2.4;
      const x = 4 * u, y = 4 * u, rad = 5 * u;
      g.fillStyle = 'rgba(255,255,255,.92)'; g.beginPath(); g.moveTo(x + rad, y); g.arcTo(x + bw, y, x + bw, y + bh, rad); g.arcTo(x + bw, y + bh, x, y + bh, rad); g.arcTo(x, y + bh, x, y, rad); g.arcTo(x, y, x + bw, y, rad); g.fill();
      let yy = y + pad * 0.6; g.textAlign = 'left'; g.textBaseline = 'top';
      lines.forEach(([t, sz], i) => { g.font = font(sz, i === 0 ? 800 : 600); g.fillStyle = i === 0 ? '#0e7c6b' : '#333'; g.fillText(t, x + pad * 1.2, yy); yy += lh(sz); });
    } else {
      g.textAlign = 'right'; g.textBaseline = 'top'; g.fillStyle = '#fff'; g.shadowColor = 'rgba(0,0,0,.55)'; g.shadowBlur = 3 * u;
      let yy = 4 * u; for (const [t, sz] of [[big || ms, 8], [parts1.join(' · '), 4.2], [parts2.join(' · '), 4.6], [note, 4.2]]) { if (!t) continue; g.font = font(sz); g.fillText(t, W - 4 * u, yy); yy += sz * u * 1.3; }
    }
    g.shadowBlur = 0;
    return cv;
  } finally { URL.revokeObjectURL(url); }
}

async function notify(title, body, data = null, quiet = false) {
  if (!quiet) toast(`${title}: ${body}`);
  try {
    if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
    const reg = await navigator.serviceWorker?.getRegistration?.();
    if (reg) reg.showNotification(title, { body, tag: title, icon: 'icon-192.png', data }); else new Notification(title, { body, icon: 'icon-192.png' });
  } catch (e) { /* 무시 */ }
}
function checkReminders() {
  checkMemory();
  const n = kv('notify', null); const child = activeChild(); if (!n || !child || child.demo) return;
  const now = Date.now(); const sent = { ...kv('notified', {}) }; let changed = false;
  if (n.feed) {
    const lf = lastOf(FEED_TYPES, child.id); const key = `feed:${lf?.id}`;
    const pf = n.feedH ? null : predictFeed(child, now); // 0 = 자동(아이 평균 간격)
    const due = lf && (n.feedH ? now - lf.start >= n.feedH * HOUR : pf && now >= pf.at);
    if (due && !sent[key]) { notify('수유 시간이에요', `${child.name} 마지막 수유 후 ${fmtDur(now - lf.start)} 지났어요`); sent[key] = now; changed = true; }
  }
  if (n.nap) {
    const p = predictSleep(child, now, timers().find((t) => t.childId === child.id && t.type === 'sleep')?.start || null);
    const key = `nap:${p?.lastEnd}`;
    if (p && !p.sleeping && p.kind === 'nap' && now >= p.from - 10 * MIN && now < p.to && !sent[key]) { notify('곧 낮잠 시간이에요', `${child.name} 깬 지 ${fmtDur(p.awake)}. ${fmtHM(p.at)}쯤 재우면 좋아요`); sent[key] = now; changed = true; }
  }
  if (n.med) {
    for (const g of feverMedStatus(child.id, now).groups) {
      if (!g.last || now - g.last.start > DAY) continue; const key = `med:${g.group}:${g.last.id}`;
      if (g.ready && !sent[key]) { notify('해열제 복용 가능', `${g.label}을(를) 지금부터 먹일 수 있어요`); sent[key] = now; changed = true; }
    }
    const rc = tempRecheck(child.id, now); const rk = `recheck:${rc?.med.id}`;
    if (rc?.due && !sent[rk]) { notify('체온 다시 재기', `${child.name} 해열제 먹인 지 ${fmtDur(now - rc.med.start)} 지났어요. 열이 내렸는지 확인해 보세요`); sent[rk] = now; changed = true; }
  }
  if (changed) { for (const k of Object.keys(sent)) if (now - sent[k] > 3 * DAY) delete sent[k]; setKV('notified', sent); }
}

const CODE_CHARS = '23456789ABCDEFGHJKMNPQRSTUVWXYZ';
function newFamilyCode() { const a = new Uint32Array(12); (crypto.getRandomValues ? crypto.getRandomValues(a) : a.forEach((_, i) => (a[i] = Math.random() * 1e9))); return Array.from(a, (n) => CODE_CHARS[n % CODE_CHARS.length]).join(''); }
function fmtCode(c) { return (c || '').replace(/(.{4})(?=.)/g, '$1-'); }
function normCode(c) { return String(c || '').toUpperCase().replace(/[^0-9A-Z]/g, ''); }

const clean = (o) => JSON.parse(JSON.stringify(o ?? null)); // undefined 제거 (Firestore는 undefined를 못 받음)

/* --- Firebase (Firestore + 익명 로그인) --- */
const FB_VER = '10.12.2';
const FirebaseAdapter = {
  name: 'Firebase',
  async init(cfg) {
    if (!window.firebase?.firestore) for (const n of ['app', 'auth', 'firestore']) await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-${n}-compat.js`);
    const fb = window.firebase;
    if (!fb.apps.length) fb.initializeApp(cfg.firebase);
    const auth = fb.auth();
    if (!auth.currentUser) await auth.signInAnonymously();
    this.uid = auth.currentUser.uid; this.db = fb.firestore(); this.fb = fb;
  },
  fam(fid) { return this.db.collection('families').doc(fid); },
  async create(fid) { await this.fam(fid).set({ app: 'yuamoa', members: [this.uid], createdAt: this.fb.firestore.FieldValue.serverTimestamp() }); },
  async join(fid) {
    let snap; try { snap = await this.fam(fid).get(); } catch (e) { throw new Error('가족 코드를 확인하지 못했어요. 코드와 인터넷 연결을 확인하세요.'); }
    if (!snap.exists) throw new Error('없는 가족 코드예요. 다시 확인해 주세요.');
    if (!(snap.data().members || []).includes(this.uid)) await this.fam(fid).update({ members: this.fb.firestore.FieldValue.arrayUnion(this.uid) });
  },
  async info(fid) { const s = await this.fam(fid).get(); return { members: (s.data()?.members || []).length }; },
  async push(fid, docs) {
    const col = this.fam(fid).collection('docs'); const ts = this.fb.firestore.FieldValue.serverTimestamp();
    let batch = this.db.batch(), n = 0, bytes = 0;
    for (const d of docs) {
      const size = JSON.stringify(d).length;
      if (n >= 400 || bytes + size > 8e6) { await batch.commit(); batch = this.db.batch(); n = 0; bytes = 0; }
      batch.set(col.doc(`${d.kind}_${d.id}`), { ...clean(d), syncedAt: ts }); n++; bytes += size;
    }
    if (n) await batch.commit();
  },
  subscribe(fid, since, onDocs, onErr) {
    let q = this.fam(fid).collection('docs').orderBy('syncedAt');
    if (since) q = q.where('syncedAt', '>', this.fb.firestore.Timestamp.fromMillis(since));
    return q.onSnapshot((snap) => {
      const out = []; let max = since;
      snap.docChanges().forEach((c) => {
        if (c.type === 'removed' || c.doc.metadata.hasPendingWrites) return;
        const d = c.doc.data(); const t = d.syncedAt?.toMillis?.() || 0; if (t > max) max = t; out.push(d);
      });
      if (out.length) onDocs(out, max);
    }, onErr);
  },
};

/* --- 내 서버 (NAS 등에서 scripts/sync-server.mjs 실행) --- */
const ServerAdapter = {
  name: '내 서버',
  async init(cfg) { this.base = String(cfg.server || '').replace(/\/+$/, ''); this.uid = deviceId(); if (!this.base) throw new Error('서버 주소가 비어 있어요'); },
  async call(path, body) {
    let res;
    try { res = await fetch(this.base + path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {}); }
    catch (e) { throw new Error('서버에 연결하지 못했어요. 주소와 인터넷 연결을 확인하세요.'); }
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.error || `서버 오류 (${res.status})`);
    return j;
  },
  create(fid) { return this.call('/api/families', { id: fid, uid: this.uid }); },
  join(fid) { return this.call(`/api/families/${fid}/join`, { uid: this.uid }); },
  info(fid) { return this.call(`/api/families/${fid}?uid=${this.uid}`); },
  push(fid, docs) { return this.call(`/api/families/${fid}/docs`, { uid: this.uid, docs: clean(docs) }).then(() => this.poke && this.poke()); },
  subscribe(fid, since, onDocs, onErr) {
    let cursor = since, stop = false, timer = null, busy = false;
    const poll = async () => {
      if (stop || busy) return; busy = true; clearTimeout(timer);
      try {
        let more = true;
        while (more && !stop) { const j = await this.call(`/api/families/${fid}/docs?uid=${this.uid}&since=${cursor}`); if (j.docs.length) { cursor = j.cursor; onDocs(j.docs, cursor); } more = j.more; }
      } catch (e) { onErr(e); }
      busy = false; if (!stop) timer = setTimeout(poll, document.hidden ? 30000 : 4000);
    };
    this.poke = () => setTimeout(poll, 300);
    poll();
    return () => { stop = true; clearTimeout(timer); this.poke = null; };
  },
};

const Sync = {
  adapter: null, status: 'off', error: '', lastSync: 0, unsub: null, timer: null, flushing: false, renderT: null,
  provider(cfg = D.kv.sync) { return cfg?.provider === 'server' ? ServerAdapter : FirebaseAdapter; },
  pending() { return Object.keys(D.kv.syncQueue || {}).length; },
  queue(kind, id) {
    if (!syncOn() || id == null) return;
    const q = { ...(D.kv.syncQueue || {}) }; q[`${kind}:${id}`] = 1; D.kv.syncQueue = q; DB.put('kv', { id: 'syncQueue', v: q });
    this.schedule();
  },
  async queueAll() {
    const q = { ...(D.kv.syncQueue || {}) };
    for (const [kind, store] of Object.entries(SYNC_STORES)) for (const o of await DB.all(store)) q[`${kind}:${o.id}`] = 1;
    for (const p of await DB.all('photos')) q[`photo:${p.id}`] = 1;
    for (const k of SHARED_KV) if (D.kv[k] !== undefined) q[`kv:${k}`] = 1;
    D.kv.syncQueue = q; await DB.put('kv', { id: 'syncQueue', v: q }); this.schedule(50);
  },
  schedule(ms = 1200) { clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), ms); },
  async docFor(kind, id) {
    const by = D.kv.sync?.deviceName || '';
    if (kind === 'photo') {
      const p = await DB.get('photos', id);
      if (!p) return { kind, id, deleted: true, updatedAt: Date.now(), by, data: null };
      if (p.kind === 'audio') return { kind, id, updatedAt: p.createdAt || 0, deleted: false, by, data: { childId: p.childId, kind: 'audio', mime: p.mime, dur: p.dur, createdAt: p.createdAt, img: await blobToDataURL(p.blob) } }; // 음성 메모는 그대로(최대 1분)
      const small = await shrinkBlob(p.blob, 960, 0.72);
      return { kind, id, updatedAt: p.createdAt || 0, deleted: false, by, data: { childId: p.childId, w: small.w, h: small.h, createdAt: p.createdAt, img: await blobToDataURL(small.blob) } };
    }
    if (kind === 'kv') return { kind, id, updatedAt: (D.kv.kvStamp || {})[id] || 0, deleted: false, by, data: { v: D.kv[id] ?? null } };
    const o = await DB.get(SYNC_STORES[kind], id);
    if (!o) return { kind, id, deleted: true, updatedAt: Date.now(), by, data: null };
    return { kind, id, updatedAt: o.updatedAt || 0, deleted: !!o.deleted, by, data: o };
  },
  async flush() {
    if (!this.adapter || this.flushing || !syncOn()) return;
    const keys = Object.keys(D.kv.syncQueue || {}); if (!keys.length) return;
    if (navigator.onLine === false) { this.setStatus('offline'); return; }
    this.flushing = true;
    try {
      const fid = D.kv.sync.familyId;
      for (let i = 0; i < keys.length; i += 100) {
        const part = keys.slice(i, i + 100); const docs = [];
        for (const k of part) { const j = k.indexOf(':'); docs.push(await this.docFor(k.slice(0, j), k.slice(j + 1))); }
        await this.adapter.push(fid, docs);
        const q = { ...(D.kv.syncQueue || {}) }; part.forEach((k) => delete q[k]); D.kv.syncQueue = q; await DB.put('kv', { id: 'syncQueue', v: q });
      }
      this.lastSync = Date.now(); this.setStatus('ok');
    } catch (e) {
      console.warn('공유 보내기 실패', e); this.setStatus('error', e.message); this.schedule(15000);
    } finally { this.flushing = false; }
    if (this.pending()) this.schedule(300);
  },
  async onRemote(docs, cursor) {
    let changed = false;
    for (const d of docs) { try { if (await this.apply(d)) changed = true; } catch (e) { console.warn('공유 반영 실패', d.kind, d.id, e); } }
    if (cursor) await setKV('syncCursor', cursor);
    this.lastSync = Date.now(); this.setStatus('ok');
    if (changed) {
      if (!D.children.find((c) => c.id === D.kv.activeChildId)) await setKV('activeChildId', D.children[0]?.id || null);
      clearTimeout(this.renderT); this.renderT = setTimeout(() => { if (!S.locked) render(); }, 250);
    }
  },
  async apply(d) {
    if (d.kind === 'photo') {
      const has = await DB.get('photos', d.id);
      if (d.deleted) { if (has) { await DB.del('photos', d.id); PhotoCache.drop(d.id); return true; } return false; }
      if (has || !d.data?.img) return false;
      await DB.put('photos', { id: d.id, childId: d.data.childId, w: d.data.w, h: d.data.h, createdAt: d.data.createdAt, blob: await dataURLToBlob(d.data.img), ...(d.data.kind === 'audio' ? { kind: 'audio', mime: d.data.mime, dur: d.data.dur } : {}) });
      return true;
    }
    if (d.kind === 'kv') {
      if (!SHARED_KV.includes(d.id)) return false;
      const st = D.kv.kvStamp || {}; if ((st[d.id] || 0) >= (d.updatedAt || 0)) return false;
      await setKV(d.id, d.data?.v ?? null, { fromSync: true }); await setKV('kvStamp', { ...(D.kv.kvStamp || {}), [d.id]: d.updatedAt });
      return true;
    }
    const store = SYNC_STORES[d.kind]; if (!store) return false;
    const local = await DB.get(store, d.id);
    if (local && (local.updatedAt || 0) >= (d.updatedAt || 0)) return false;
    const obj = d.deleted ? { ...(d.data || {}), id: d.id, deleted: true, updatedAt: d.updatedAt } : d.data;
    await DB.put(store, obj);
    const arr = D[store]; const i = arr.findIndex((x) => x.id === d.id);
    if (store === 'records') { if (i >= 0) arr[i] = obj; else arr.push(obj); }
    else if (obj.deleted) { if (i >= 0) arr.splice(i, 1); }
    else { if (i >= 0) arr[i] = obj; else arr.push(obj); if (store === 'children') arr.sort((a, b) => a.createdAt - b.createdAt); }
    return true;
  },
  setStatus(s, err = '') { const was = this.status + this.error; this.status = s; this.error = err; if (was !== s + err && S.stack.some((x) => x.page === 'family')) render(); },
  async start() {
    if (!syncOn()) return;
    const cfg = D.kv.sync;
    this.stopListen(); this.adapter = this.provider(cfg); this.setStatus('connecting');
    try {
      await this.adapter.init(cfg);
      this.unsub = this.adapter.subscribe(cfg.familyId, D.kv.syncCursor || 0, (docs, cur) => this.onRemote(docs, cur), (e) => { console.warn(e); this.setStatus('error', e.message || '연결이 끊겼어요'); });
      this.setStatus('ok'); this.schedule(100);
    } catch (e) { console.warn(e); this.adapter = null; this.setStatus('error', e.message); setTimeout(() => syncOn() && !this.adapter && this.start(), 30000); }
  },
  stopListen() { try { this.unsub && this.unsub(); } catch (e) { /* 무시 */ } this.unsub = null; },
  /* 가족 만들기/참여: cfg = { provider, firebase?, server?, deviceName } */
  async connect(cfg, code) {
    const ad = this.provider(cfg); await ad.init(cfg);
    const fid = code ? normCode(code) : newFamilyCode();
    if (code) { if (fid.length !== 12) throw new Error('가족 코드는 12자리예요.'); await ad.join(fid); } else await ad.create(fid);
    await setKV('sync', { ...cfg, familyId: fid, joinedAt: Date.now() }); await setKV('syncCursor', 0);
    // 이 기기에 있던 기록도 모두 가족 공간에 올린다 (합치기)
    await this.queueAll(); await this.start();
    return fid;
  },
  async disconnect() { this.stopListen(); this.adapter = null; clearTimeout(this.timer); await setKV('sync', null); await setKV('syncQueue', {}); await setKV('syncCursor', 0); this.status = 'off'; },
};

async function shrinkBlob(blob, max, q) {
  try {
    const bmp = await createImageBitmap(blob); const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    if (k >= 1 && blob.size < 180000) return { blob, w: bmp.width, h: bmp.height };
    const w = Math.round(bmp.width * k), h = Math.round(bmp.height * k); const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(bmp, 0, 0, w, h); const out = await new Promise((r) => cv.toBlob(r, 'image/jpeg', q));
    return { blob: out || blob, w, h };
  } catch (e) { return { blob, w: 0, h: 0 }; }
}

/* 앱 설정 파일(config.js)에 미리 넣어 둔 연결 정보 */
function presetSync() { const c = window.YUAMOA_CONFIG || {}; if (c.firebase?.apiKey) return { provider: 'firebase', firebase: c.firebase }; if (c.server) return { provider: 'server', server: c.server }; return null; }
function parseFirebaseConfig(text) {
  const t = String(text || ''); const pick = (k) => (t.match(new RegExp(`["']?${k}["']?\\s*:\\s*["']([^"']+)["']`)) || [])[1];
  const cfg = { apiKey: pick('apiKey'), authDomain: pick('authDomain'), projectId: pick('projectId'), storageBucket: pick('storageBucket'), messagingSenderId: pick('messagingSenderId'), appId: pick('appId') };
  Object.keys(cfg).forEach((k) => cfg[k] === undefined && delete cfg[k]);
  return cfg.apiKey && cfg.projectId ? cfg : null;
}

/* ===== 드르륵 눈금자 (한 손 입력) =====
   엄지로 좌우로 밀면 값이 바뀌고, 한 칸 넘어갈 때마다 짧게 진동(안드로이드).
   세게 튕기면 관성으로 더 굴러가고, 왼쪽/오른쪽 끝을 톡 치면 한 칸씩 움직인다.

    data-px="${px}" data-major="${major}" data-label="${label}" data-after="${after}" data-fmt="${fmt}">
    <div class="ruler-val"><b class="num"></b><span class="ruler-sub"></span></div>
    <div class="ruler-track"><canvas></canvas><i class="ruler-needle"></i><span class="ruler-edge l">‹</span><span class="ruler-edge r">›</span></div>
  </div>`;
}
function rulerText(el, v) {
  const k = el.dataset.kind, dec = +el.dataset.dec, unit = el.dataset.unit;
  if (k === 'time') return [fmtTime(v), `${fmtDate(v)}${sameDay(v, Date.now()) ? ' · 오늘' : ''}`];
  if (k === 'dur') return [v ? fmtDur(v * MIN) : '0분', el.dataset.fmt === 'end' && S.editor ? (v ? `${fmtTime(S.editor.draft.start + v * MIN)}에 끝남` : '아직 진행 중') : ''];
  return [`${fmtNum(v, dec)}${unit}`, ''];
}
function tickLabel(el, v) {
  const k = el.dataset.kind;
  if (k === 'time') return fmtHM(v);
  if (k === 'dur') return v % 60 === 0 && v ? `${v / 60}시간` : `${v}`;
  return fmtNum(v, +el.dataset.dec);

let _hapticAt = 0;
function haptic() { const t = performance.now(); if (t - _hapticAt < 30) return; _hapticAt = t; try { navigator.vibrate && navigator.vibrate(4); } catch (e) { /* 지원 안 함 */ } }

  const n = Math.ceil(w / 2 / px) + 2; const base = Math.round((v - min) / step);
  c.font = '11px ' + (cs.getPropertyValue('--f-body') || 'sans-serif'); c.textAlign = 'center';
  for (let i = -n; i <= n; i++) {
    const idx = base + i; const tv = min + idx * step; if (tv < min - 1e-9 || tv > max + 1e-9) continue;

function statusIds() {
  const l = kv('statusCards', DEFAULT_STATUS);
  const ok = (Array.isArray(l) ? l : DEFAULT_STATUS).filter((id, i, a) => STATUS_CARDS[id] && a.indexOf(id) === i).slice(0, STATUS_MAX);
  return ok.length ? ok : DEFAULT_STATUS;
}

function statusCtx(child, now) {
  let stats = null;
  return { child, cid: child.id, now, today: () => (stats ||= dailyStats(child.id, dayStart(now), 1, now)[0]) };
}
function statusDraw(id, c) {
  try { return STATUS_CARDS[id].draw(c); } catch (e) { console.warn('상태 카드', id, e); return { tone: 'etc', label: STATUS_CARDS[id].name, val: '-', sub: '', act: 'slotPick', a: '0' }; }
}

/* 칸마다 오른쪽 위 연필 → 그 칸에 넣을 카드 고르기. 빈 칸은 "+ 카드 넣기" */
function statusGrid(child, now = Date.now()) {
  const c = statusCtx(child, now), ids = statusIds();

}

};

/* ---- 19-save.js ---- */
/* ===== 파일 저장 (사진·스티커·백업) =====
   어디서 열었는지에 따라 저장 길이 다르다.
   1) Claude 링크로 연 웹앱: 페이지가 직접 내려받을 수 없어서, Claude의 저장 확인 창(downloads)을 쓴다.
   2) 홈 화면에 추가한 앱(아이폰 등): 공유 창 → "이미지 저장"으로 사진 앱에 바로 들어간다.
   3) 그 밖의 브라우저: 일반 내려받기.
   여러 장은 공유 창이면 한 번에 넘기고, 그 밖에는 zip 하나로 묶는다. */
const DOWNLOADS = (typeof window !== 'undefined' && window.claude && typeof window.claude.use === 'function')
  ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
async function downloadsCap() { return Promise.race([DOWNLOADS, new Promise((r) => setTimeout(() => r(null), 2500))]); }

/* --- zip (압축 없이 묶기만: 사진은 이미 압축돼 있음) --- */
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xffffffff; for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xff] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; }
async function makeZip(files) {
  const enc = new TextEncoder(); const parts = []; const central = []; let offset = 0;
  const d = new Date(); const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1); const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  for (const f of files) {
    const name = enc.encode(f.name); const data = new Uint8Array(await f.blob.arrayBuffer()); const crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(lh.buffer, name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true);
    ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
    central.push(ch.buffer, name);
    offset += 30 + name.length + data.length;
  }
  const cSize = central.reduce((a, b) => a + b.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true); end.setUint32(12, cSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end.buffer], { type: 'application/zip' });
}

function anchorDownload(blob, name) {
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
}
/* files: [{ name, blob }]. 결과: 'saved' | 'shared' | 'downloaded' | 'cancelled' | 'failed' */
/* 바깥 파일 이름은 영문·숫자만 (일부 브라우저가 한글 이름을 버리고 "download"로 저장함). zip 안의 사진 이름은 한글 그대로 */
const asciiName = (name, fallback) => { const m = name.match(/\.([a-z0-9]+)$/i); const ext = m ? m[1] : ''; const base = name.replace(/\.[a-z0-9]+$/i, '').replace(/[^A-Za-z0-9_-]+/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, ''); return `${base || fallback}${ext ? '.' + ext : ''}`; };
async function saveFiles(files, zipName, { shareTitle = '육아모아' } = {}) {
  if (!files.length) return 'failed';
  zipName = asciiName(zipName, 'yuamoa');
  const dl = await downloadsCap();
  if (dl) {
    const one = files.length === 1;
    try { await dl.save({ filename: one ? asciiName(files[0].name, 'yuamoa') : zipName, data: one ? files[0].blob : await makeZip(files) }); return 'saved'; }

/* --- 한 장면 그리기 --- */
const memEase = (x) => x * x * (3 - 2 * x);

/* --- 음악 만들기 (OfflineAudioContext로 한 번에 연주해 두고 재생) --- */
async function memMusic(mood, seconds) {

    else if (e.voice === 'bell') { tone('sine', f * 2, e.t, e.dur, e.vel * 0.2, 1.8); tone('sine', f * 2 * 2.76, e.t, e.dur, e.vel * 0.04, 0.7); }
    else if (e.voice === 'bass') tone('sine', f, e.t, e.dur, e.vel * 0.28, Math.min(e.dur, 3.5));

/* --- 재생·녹화 --- */

const CARE_API = (typeof window !== 'undefined' && window.YUAMOA_CONFIG?.api) || 'https://yugamoa-api.terranova6.workers.dev';

async function careFetch(route, params = {}) {
  const qs = new URLSearchParams(Object.entries(params).filter(([, v]) => v != null && v !== '')).toString();
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 15000);
  try {
    const r = await fetch(`${CARE_API}/${route}${qs ? '?' + qs : ''}`, { signal: ctl.signal });
    const text = await r.text();
    if (text.trim().startsWith('{')) { const j = JSON.parse(text); if (j.error) throw new Error(j.error); return j; }

}

    else if (!d.length) h += `<div class="card empty">${N.tab === 'ped' ? '이 지역에서 소아청소년과를 찾지 못했어요. 아래 지도 앱으로 더 넓게 찾아보세요.' : '주변에서 찾지 못했어요.'}</div>`;
    else {
      const all = d; const fl = nearFiltered(N.tab, all); const fOn = (N.filters[N.tab] || []).length;
      h += nearFilterBar(N.tab);
      if (fOn) h += `<p class="small near-count"><b>${fl.length}곳</b>이 조건에 맞아요 <span class="muted">(전체 ${all.length}곳)</span></p>`;
      if (!fl.length) h += `<div class="card empty">조건에 맞는 곳이 없어요. 필터를 줄여 보세요.</div>`;
      else if (N.tab === 'er') h += `<p class="small muted near-hint">가까운 순이에요. <b>소아 병상</b>은 응급실 안의 소아 전용 병상 수예요. 병상 수는 병원이 입력한 값이라 실제와 다를 수 있어요.</p>` + fl.map(nearErCard).join('');
      else h += `<p class="small muted near-hint">${N.tab === 'ped' ? '지금 진료 중인 곳을 먼저, 가까운 순으로 보여 줘요. 같은 시·군·구 안의 소아청소년과예요.' : '지금 문 연 약국을 먼저, 가까운 순으로 보여 줘요.'} 공휴일·점심시간은 다를 수 있어요.</p>` + fl.map(nearOpenCard).join('');
    }
  }
  h += `<p class="tiny muted">자료: 국립중앙의료원 응급의료정보(공공데이터포털). 실제 운영 상황과 다를 수 있으니 출발 전에 전화로 확인하세요. 위치는 주변 검색에만 쓰고 저장하지 않아요.</p></div>`;
  if (withLinks) h += sectionTitle('지도 앱에서 찾기') + nearbyLinksHtml();
  return h;
}
ACT.nearTab = (el) => { S.near.tab = el.dataset.a; render(); nearLoadTab(S.near.tab); };
ACT.nearRetry = () => { S.near.status = 'idle'; nearStart(); };

/* ---- 23-hosp.js ---- */
/* ===== 병원 탭: 지금 갈 수 있는 곳 + 진료 갈 때 필요한 것 =====
   건강 탭(아이 상태 기록·확인)과 나눠, 병원·응급실·약국과 관련된 것은 여기에 모은다. */
function viewLogSeg() { return `<div class="stack log-seg" style="margin-top:4px">${seg([['timeline', '타임라인'], ['album', '앨범']], S.tab, 'tab')}</div>`; }
function viewHospital(child) {
  const cid = child.id;
  let h = `<div class="hosp-quick">
    <button type="button" data-act="push" data-a="report"><span class="mi" style="--tone:var(--c-hospital)">${ICONS.report}</span><b>진료 리포트</b><span class="small muted">의사에게 보여 줄 요약</span></button>
    <button type="button" data-act="newRec" data-a="hospital"><span class="mi" style="--tone:var(--c-hospital)">${svgIcon('hospital')}</span><b>병원 다녀온 기록</b><span class="small muted">진단·처방 남기기</span></button>
    <button type="button" data-act="push" data-a="feverGuide"><span class="mi" style="--tone:var(--c-temp)">${ICONS.fire}</span><b>병원에 가야 할 때</b><span class="small muted">바로 진료가 필요한 신호</span></button>
    <button type="button" data-act="push" data-a="healthCal"><span class="mi" style="--tone:var(--c-vaccine)">${ICONS.calendar}</span><b>접종·검진 일정</b><span class="small muted">달력으로 보기</span></button>
  </div>`;
  h += sectionTitle('지금 갈 수 있는 곳') + nearbyBody(false);
  const visits = recsOfType(['hospital', 'vaccine'], cid).slice(-5).reverse();
  h += sectionTitle('최근 병원 기록');
  h += visits.length ? `<div class="rec-list">${visits.map((x) => recRow(x, { showDate: true })).join('')}</div>` : `<div class="card empty">병원·접종 기록이 아직 없어요.</div>`;
  h += sectionTitle('지도 앱에서 찾기') + nearbyLinksHtml();
  return h;
}
